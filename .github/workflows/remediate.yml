name: remediate

# Remediation editions (src/remediation.ts, APIs.md "Remediation editions"): days a source's backfill could not fetch
# whole (FEED-DQ-1 / DQ-3: a one-day window still filled the page cap, listed in knowledge/index/backfill.json
# `saturatedDays`) and days the live layer's start left empty (the 2026-06-28..07-03 seam). Each day's sources are
# asked again in sub-day windows and the day is published as an ADDITIVE, immutable edition in the Release
# `remediation-YYYY` (beside the raw answers); the archived day, its archive asset and the manifest are never touched.
# The data branch gains only knowledge/index/remediation.json, written by the `commit` job, which holds no writer lock
# (FEED-OPS-4, round 14): no other writer touches the file, so its push rebases onto theirs.
# A dispatch with `refill` adds the range to the PERSISTENT refill queue (remediation.json `refill_queue`); the queue's
# days are taken once their month is archived (archive.yml), by any later run and by the daily scheduled run, which
# does the queue only (nothing when it is empty or still waiting). A run does at most `max_days` days, one request at
# a time, at least 1.1 s apart.
# The late-ComCat refresh (`late_usgs`, SHLTR-150): ComCat publishes and upgrades many M4.5+ solutions days or weeks
# after the origin, after the live day froze. The scheduled run asks ComCat again for every frozen, unarchived day of the
# last 45 and publishes a `late_usgs` edition, built on the day's frozen partition, for each day whose M4.5+ set changed;
# the mode of the scheduled run is LATE_USGS_SCHEDULED in src/remediation.ts (`plan`: ask and diff, publish nothing;
# `on`; `off`). A dispatch with `late_usgs` runs it now (with `dry_run`, into the artifact), over `late_usgs_range`
# instead of the last 45 days for the catch-up of older frozen days.
on:
  schedule:
    - cron: '43 4 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (the default): no Release, no upload, no commit, the produced assets become a 3-day workflow artifact; set false to publish'
        type: boolean
        default: true
      days:
        description: 'Only these tasks, e.g. kagsr:2025-07-30,afad:2025-08-11 (blank = every saturated day, Kamchatka and Sındırgı first)'
        required: false
      max_days:
        description: 'Days per run (blank = 8; the scheduled run does 3)'
        required: false
      refill:
        description: 'Queue a refill of these days, e.g. 2026-06-28..2026-07-03 (taken as each day is archived); the run then does the queue only'
        required: false
      providers:
        description: 'With refill: bootstrap-2026-07-05 (the 15 sources of the seam) or a comma list of source ids'
        required: false
      late_usgs:
        description: 'Late-ComCat refresh of the frozen, unarchived days (SHLTR-150): on = build editions, plan = diff only; the run then skips the saturated days'
        type: choice
        options: ['off', 'plan', 'on']
        default: 'off'
      late_usgs_range:
        description: 'With late_usgs: these days instead of the last 45, e.g. 2026-08-01..2026-08-31 (at most 31; frozen, unarchived days only)'
        required: false

concurrency:
  group: earthquakes-feed-remediate
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  collect:
    # Outside the writer group: fetching and building take minutes and must not hold up the 5-minute aggregate.
    # It writes nothing to the data branch, only Release assets (immutable, never --clobber).
    runs-on: ubuntu-24.04
    # The late-ComCat refresh starts no day after 20 minutes (REMEDIATION_DEADLINE_S); the queue's days come first.
    timeout-minutes: 45
    permissions:
      contents: write
    outputs:
      changed: ${{ steps.run.outputs.changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Blobless and sparse: the index files; the late-ComCat refresh reads a frozen day partition by its blob (git
      # fetches the one blob).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: data
          path: .data
          fetch-depth: 1
          filter: blob:none
          persist-credentials: false
          sparse-checkout: |
            knowledge/index/backfill.json
            knowledge/index/archives.json
            knowledge/index/head.json
            knowledge/index/partition-format.json
            knowledge/index/remediation.json
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Remediate
        id: run
        env:
          DATA_DIR: .data
          REMEDIATION_OUT: remediation-out
          REMEDIATION_DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
          REMEDIATION_DAYS: ${{ inputs.days }}
          REMEDIATION_MAX_DAYS: ${{ inputs.max_days || (github.event_name == 'schedule' && '3' || '') }}
          REMEDIATION_REFILL: ${{ inputs.refill }}
          REMEDIATION_PROVIDERS: ${{ inputs.providers }}
          REMEDIATION_QUEUE_ONLY: ${{ github.event_name == 'schedule' && '1' || '' }}
          # The scheduled run: the mode src/remediation.ts LATE_USGS_SCHEDULED names; a dispatch: its input.
          REMEDIATION_LATE_USGS: ${{ github.event_name == 'schedule' && 'scheduled' || inputs.late_usgs }}
          REMEDIATION_LATE_USGS_RANGE: ${{ inputs.late_usgs_range }}
          # gh: the archived months (read only) and the remediation assets.
          GH_TOKEN: ${{ github.token }}
        run: npx --no-install tsx src/remediate.ts
      - if: steps.run.outputs.changed == 'true' && !inputs.dry_run
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: remediation-index
          path: remediation-out/remediation.json
          retention-days: 3
      - if: inputs.dry_run
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: remediation-dry-run
          path: remediation-out/
          retention-days: 3

  commit:
    needs: collect
    # Also when a step after the remediation turned collect red: once remediate.ts has written its index (output
    # `changed`), whatever it uploaded must reach the data branch. A run that died inside remediate.ts writes no index;
    # its uploaded assets stay unindexed and the next run uses the next free names (assets are never replaced).
    if: ${{ !cancelled() && needs.collect.outputs.changed == 'true' && !inputs.dry_run }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      # The main checkout holds only scripts/push-data.sh, the push loop every writer shares. First: checkout empties a
      # directory that is not yet a repository, so it must not run after the artifact download.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: scripts/push-data.sh
          sparse-checkout-cone-mode: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: data
          path: .data
          fetch-depth: 1
          sparse-checkout: |
            knowledge/index/remediation.json
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: remediation-index
          path: remediation-out
      - name: Commit the remediation index (and nothing else)
        working-directory: .data
        run: |
          set -euo pipefail
          mkdir -p knowledge/index
          cp ../remediation-out/remediation.json knowledge/index/remediation.json
          git config user.name  "earthquakes-feed-bot"
          git config user.email "bot@users.noreply.github.com"
          git add knowledge/index/remediation.json
          staged=$(git diff --cached --name-only)
          if [ -z "$staged" ]; then echo 'no changes'; exit 0; fi
          if [ "$staged" != "knowledge/index/remediation.json" ]; then echo "::error::refusing to commit anything but knowledge/index/remediation.json: $staged"; exit 1; fi
          git commit -m "remediate: index @ $(date -u +%FT%TZ)"
          # No writer lock (FEED-OPS-4): only this workflow writes these files, so a push that loses the race to another
          # writer fetches, rebases this one commit onto it (no conflict possible) and tries again (scripts/push-data.sh).
          PUSH_ATTEMPTS=6 PUSH_BACKOFF_S=3 bash "$GITHUB_WORKSPACE/scripts/push-data.sh"
