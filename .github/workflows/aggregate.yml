name: aggregate

# Phase 1: fetch every source, dedup, append to the observation log, commit to `data`.
# Public repo => Actions is free & unlimited. Cron is offset off :00; GitHub delivers
# scheduled runs best-effort (often sparser than 5 min) — freshness contract is 30 min.
#
# FALLBACK ONLY, every 15 min. The external Cloudflare-Worker heartbeat already dispatches
# this workflow every 5 min, so a 5-min cron on top of it put ~2 arrivals per 5 min into the
# serialized `earthquakes-feed-writer` group while each run takes 1-3 min. Any slowdown then
# cascades: with `cancel-in-progress: false` each new arrival supersedes the pending one, so
# nothing completes at all (2026-07-27 23:50-00:13 — every cycle cancelled, manifest 26 min
# stale; same shape as the 48 cancelled aggregates on 2026-07-09). This cron now only covers
# the heartbeat being down, which the 30-min contract tolerates.
on:
  schedule:
    - cron: '9,24,39,54 * * * *'
  workflow_dispatch:

concurrency:
  group: earthquakes-feed-writer
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  aggregate:
    # Pinned, not ubuntu-latest: ubuntu-latest moves to Ubuntu 26.04 from 2026-10-19
    # (actions/runner-images#14748). Move to ubuntu-26.04 deliberately, after a green test run.
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/checkout@v5
        with:
          ref: data
          path: .data
          fetch-depth: 1
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Aggregate
        env:
          DATA_DIR: .data
          # Every fetch resolves its host through getaddrinfo, which runs on libuv's thread pool
          # (4 threads by default). On this runner one lookup takes 0.05-3 s (systemd-resolved),
          # so the ~43 lookups of a run queued in fetch order: 1.3 s for the first four places,
          # 9.8 s for the last, and the sweeps, issued last with an 8 s timeout, aborted in almost
          # every run (PF-5c; scripts/fetch-order-probe.ts, 2026-09-30). With 64 threads no lookup
          # waits for a thread: the slowest took 3.1 s whatever its place. Must be set before
          # node starts; an empty value would mean ONE thread.
          UV_THREADPOOL_SIZE: '64'
        run: npx --no-install tsx src/aggregate.ts
      - name: Commit & push observation log
        working-directory: .data
        run: |
          git config user.name  "earthquakes-feed-bot"
          git config user.email "bot@users.noreply.github.com"
          git add knowledge status status.json .gitignore
          git commit -m "aggregate: seq=$(node -e "process.stdout.write(String(require('./knowledge/index/head.json').seq))") @ $(date -u +%FT%TZ)" \
            || { echo 'no changes'; exit 0; }
          # Fail-loud push loop: a swallowed rebase conflict here silently loses data (H3). Three attempts, rebasing
          # onto a concurrent writer's commit; a conflict aborts the rebase and fails (tests/push-data.test.ts).
          bash "$GITHUB_WORKSPACE/scripts/push-data.sh"
