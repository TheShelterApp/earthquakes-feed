name: aggregate

# Phase 1: fetch every source, dedup, append to the observation log, commit to `data`; then phase 2 in the same job
# (.github/actions/derive-publish): rebuild the derived views from that commit and publish them.
# Public repo => Actions is free & unlimited. GitHub delivers scheduled runs best-effort (often sparser than 5 min) —
# freshness contract is 30 min.
#
# FALLBACK ONLY, every 15 min. The external Cloudflare-Worker heartbeat already dispatches
# this workflow every 5 min, so a 5-min cron on top of it put ~2 arrivals per 5 min into the
# serialized `earthquakes-feed-writer` group while each run takes 1-3 min. This cron now only covers
# the heartbeat being down, which the 30-min contract tolerates.
#
# The writer lock (FEED-OPS-4, round 14). Every workflow that commits to `data` beyond its own side index (aggregate,
# backfill, archive, derive.yml by hand) shares the group `earthquakes-feed-writer` with `queue: max`: runs wait in
# arrival order (GitHub keeps up to 100 pending; changelog 2026-05-07). With the default queue a group keeps ONE
# pending run and a newer arrival cancels it: in the week 2026-09-29 → 10-06 that cancelled 29 aggregate, 41 derive,
# 8 backfill and 10 first-solutions commit runs, the last ones after 31 minutes of requests each
# (scripts/writer-group-sim.ts replays that week through GitHub's rules: 80 of the 91 runs GitHub cancelled, 3 more).
# derive used to be a workflow of its own, triggered by every completed aggregate run: a second arrival every 5
# minutes and a second checkout of the 539 MB data tree (75 of derive's 109 s). It now runs at the end of this job, on
# the checkout the aggregate step committed from: 2 minutes of the group per cycle instead of 3.4. The side-index
# commit jobs (history, first-solutions, remediate) write only their own files and push without the lock.
#
# The lock is job-level since SHLTR-149 (incident 2026-11-08: 47 backfill dispatches queued in the group ahead of every
# aggregate run, the live manifest 1 h 47 min stale). A workflow-level lock makes a run wait before any of its steps,
# so nothing can keep it out of the queue; at job level the other writers (backfill, archive, derive) start with a
# `gate` job outside the group (scripts/writer-queue.mjs) that refuses to join when 2 writer runs already wait, unless
# dispatched with force=true. This workflow has no gate: aggregate is never refused, and it waits behind at most the
# run holding the group and those 2 (about 6 min with today's run times; README.md "Writer group").
on:
  schedule:
    - cron: '9,24,39,54 * * * *'
  workflow_dispatch:
    inputs:
      recover:
        # Blank on every scheduled and heartbeat run (the heartbeat dispatches without inputs). By hand only, once per
        # outage: src/recover.ts, APIs.md "Late publications" (recovered reports).
        description: "Also read these events from the source's per-event pages and ingest them (e.g. tmd:17182-17198); blank = a normal run"
        type: string
        required: false
        default: ''

permissions:
  contents: write

jobs:
  aggregate:
    # The writer lock (job-level; see the top of this file and scripts/writer-queue.mjs WRITERS).
    concurrency:
      group: earthquakes-feed-writer
      cancel-in-progress: false
      queue: max
    # Pinned, not ubuntu-latest: ubuntu-latest moves to Ubuntu 26.04 from 2026-10-19
    # (actions/runner-images#14748). Move to ubuntu-26.04 deliberately, after a green test run.
    runs-on: ubuntu-24.04
    # The aggregate part had 5 minutes and derive 12 as jobs of their own (a failing Pages deploy runs ~3 min before
    # erroring out). The Aggregate step keeps its own bound. The Pages deploy reads this budget (job-timeout-minutes
    # below, kept equal by tests/pages-deploy.test.ts): each attempt is capped and a retry starts only while 7 min are
    # left, so a hung upload no longer runs the job into this timeout (run 38112591591, 2026-10-11).
    timeout-minutes: 16
    # Restated in full at job level (a job-level block sets every permission it does not name to none): the push to
    # `data`, and GitHub OIDC tokens for the state store (storage phase 3, src/state-store.ts: the audience
    # earthquakes-feed-state, verified by the state Worker; no static secret exists). Never at workflow level, where it
    # would reach any job added later; tests/stage-data.test.ts names every job that holds it.
    permissions:
      contents: write
      id-token: write
    steps:
      # First, so the Pages deploy (.github/actions/derive-publish) counts the job's budget from about its start.
      - name: Note the job's start
        run: echo "FEED_JOB_STARTED_S=$(date -u +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: data
          path: .data
          fetch-depth: 1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: State shadow hydrate
        # Storage phase 3a (APIs.md "Repository size"): every day the committed generation (knowledge/index/generation.json)
        # names is fetched from the state store, each blob checked against it, and compared with the checked-out
        # event map (src/event-map-store.ts hydrate, mode shadow). Git is still the truth: a mismatch or a store error
        # is reported (the step summary, a ::warning::, and the marker the health workflow reads: feed:state-shadow),
        # never repaired here and never a reason to stop the feed. Before anything writes the checkout.
        # FEED_STATE_BACKEND: the store is on (`worker`) by default since the phase-3a rollout; the repository variable
        # FEED_STATE_BACKEND=off is phase 3a's kill switch (both state steps then report "off" and touch nothing;
        # health notes it). APIs.md, the phase-3a rollout.
        continue-on-error: true
        # The days that differ from the generation plus a rotating sample of 4 (every day about hourly; usually one
        # request of about 1.2 MB), in batches of at most 2.5 MB, 3 in flight, each retried on its own for the blobs it
        # has not yet received (src/state-store.ts getBlobs). Phase 3a's policy (src/event-map-store.ts
        # SHADOW_RETRY_POLICY): 4 short attempts a batch (5 s + 2 s a MB) and a 30 s deadline over the whole step, so a
        # hanging store costs this 5-minute job seconds, not minutes; this timeout is only the backstop (a step it kills
        # leaves its "killed" marker, which health reads as a failed step).
        timeout-minutes: 2
        env:
          DATA_DIR: .data
          FEED_STATE_BACKEND: ${{ vars.FEED_STATE_BACKEND || 'worker' }}
          FEED_STATE_URL: https://feed-state.theshelter.app
          FEED_STATE_AUDIENCE: earthquakes-feed-state
          FEED_STATE_MARKER_DIR: ${{ runner.temp }}/state-shadow
        run: npx --no-install tsx src/event-map-store.ts hydrate
      - name: Snapshot the silent-change baseline
        # Before anything writes the data checkout: the day partitions of the live window rebuilt from the event map the
        # previous derive read (src/live-baseline.ts), into the runner's temp directory, outside .data; a day that differs
        # from what that derive recorded (it failed after its aggregate commit) is taken from its Pages copy when that
        # matches. derive's silent-change check verifies every day against the recorded sha256; without a snapshot it
        # has no baseline for that run (a warning), so this step never stops the aggregate.
        continue-on-error: true
        # About half a second (the event map of the window), plus at most 45 s of Pages requests after a failed derive;
        # a hang must not eat the job budget the deploy counts on.
        timeout-minutes: 2
        env:
          DATA_DIR: .data
          LIVE_BASELINE_DIR: ${{ runner.temp }}/live-baseline
        run: npx --no-install tsx src/live-baseline.ts
      - name: Aggregate
        timeout-minutes: 4
        env:
          DATA_DIR: .data
          # Every fetch resolves its host through getaddrinfo, which runs on libuv's thread pool
          # (4 threads by default). On this runner one lookup takes 0.05-3 s (systemd-resolved),
          # so the ~43 lookups of a run queued in fetch order: 1.3 s for the first four places,
          # 9.8 s for the last, and the sweeps, issued last with an 8 s timeout, aborted in almost
          # every run (PF-5c; scripts/fetch-order-probe.ts, 2026-09-30). With 64 threads no lookup
          # waits for a thread: the slowest took 3.1 s whatever its place. Must be set before
          # node starts; an empty value would mean ONE thread.
          UV_THREADPOOL_SIZE: '64'
          # Passed through the environment, never written into the script: src/recover.ts parses it strictly.
          FEED_RECOVER: ${{ inputs.recover }}
        run: npx --no-install tsx src/aggregate.ts
      - name: State persist
        # Storage phase 3a: every event-map day whose canonical bytes differ from its generation entry is gzipped and
        # PUT to the state store, then knowledge/index/generation.json is rewritten, before the commit below stages it
        # with the rest of `knowledge` (the one push commits the generation with head.json, sweeps.json, watermarks.json,
        # the markers and onboard.json). A store error leaves generation.json as it was, so a generation only names
        # blobs that exist; the next run uploads again. Phase 3a: reported, never fatal (git still tracks the event map).
        # The first phase-3a run uploads all 46 days (about 12 MB, 4 PUTs at a time). Phase 3a's policy: 2 attempts of at
        # most 15 s a request and a 60 s deadline over the whole step; this timeout is only the backstop.
        continue-on-error: true
        timeout-minutes: 2
        env:
          DATA_DIR: .data
          FEED_STATE_BACKEND: ${{ vars.FEED_STATE_BACKEND || 'worker' }}
          FEED_STATE_URL: https://feed-state.theshelter.app
          FEED_STATE_AUDIENCE: earthquakes-feed-state
          FEED_STATE_MARKER_DIR: ${{ runner.temp }}/state-shadow
        run: npx --no-install tsx src/event-map-store.ts persist
      - name: Upload the state report
        # The markers of the two state steps (hydrate.json, persist.json), which the health workflow's feed evaluator
        # reads from the newest runs (scripts/feed-health.mjs, feed:state-shadow).
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: state-shadow
          path: ${{ runner.temp }}/state-shadow
          if-no-files-found: ignore
          retention-days: 1
      - name: Commit & push observation log
        working-directory: .data
        run: |
          git config user.name  "earthquakes-feed-bot"
          git config user.email "bot@users.noreply.github.com"
          git add knowledge status status.json .gitignore
          # Storage phase 3b (src/event-map-store.ts `stage`; nothing while EVENT_MAP_IN_GIT=1, phase 3a): the transition
          # (every tracked event-map day file leaves the index, the sentinel and the .gitignore lines are staged), then
          # the check that no event-map path but the sentinel is staged (a lost .gitignore line would re-track 78 MB).
          ( cd "$GITHUB_WORKSPACE" && DATA_DIR=.data npx --no-install tsx src/event-map-store.ts stage )
          git commit -m "aggregate: seq=$(node -e "process.stdout.write(String(require('./knowledge/index/head.json').seq))") @ $(date -u +%FT%TZ)" \
            || { echo 'no changes'; exit 0; }
          # Fail-loud push loop: a swallowed rebase conflict here silently loses data (H3). Five attempts with a 5 s
          # backoff (at most 50 s of pauses under the writer lock) ride out a GitHub 5xx blip, rebasing onto a
          # concurrent writer's commit; a conflict aborts the rebase and fails (tests/push-data.test.ts).
          PUSH_ATTEMPTS=5 PUSH_BACKOFF_S=5 bash "$GITHUB_WORKSPACE/scripts/push-data.sh"
      # Phase 2. Only after a pushed (or unchanged) aggregate: a failed step above skips it, so derive never builds on
      # a failed aggregate (M6).
      - name: Derive and publish
        uses: ./.github/actions/derive-publish
        with:
          cf-api-token: ${{ secrets.CF_API_TOKEN }}
          cf-account-id: ${{ secrets.CF_ACCOUNT_ID }}
          job-started-at: ${{ env.FEED_JOB_STARTED_S }}
          job-timeout-minutes: 16
          feed-signing-key: ${{ secrets.FEED_SIGNING_KEY }}
          feed-signing-kid: ${{ vars.FEED_SIGNING_KID }}
          r2-access-key-id: ${{ secrets.R2_ACCESS_KEY_ID }}
          r2-secret-access-key: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          r2-s3-endpoint: ${{ vars.R2_S3_ENDPOINT }}
          r2-bucket: ${{ vars.R2_BUCKET }}
          r2-public-base: ${{ vars.R2_PUBLIC_BASE }}
