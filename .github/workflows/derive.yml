name: derive

# Phase 2 alone: rebuild derived views (rolling summaries, per-day partitions + Pages day files, manifest) as a pure
# function of the log, then publish (.github/actions/derive-publish). Since FEED-OPS-4 (round 14) every aggregate run
# ends with these same steps on its own checkout, so this workflow is no longer triggered by aggregate (workflow_run)
# or by a cron: each of those runs was a second arrival in the writer group every 5 minutes, and a pending one was
# cancelled by the next arrival (41 derive runs in the week 2026-09-29 → 10-06). Dispatch it by hand to republish
# without fetching: gh workflow run derive.yml -R TheShelterApp/earthquakes-feed
on:
  workflow_dispatch:
    inputs:
      force:
        description: 'Join the writer queue even when 2 writer runs already wait (README.md "Writer group"): every aggregate run waits behind it'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  # Outside every group: the writer lock is taken by the job below, and only when this gate admits it (SHLTR-149;
  # scripts/writer-queue.mjs, README.md "Writer group").
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      # The repository's unfinished runs and their jobs (the writer queue).
      actions: read
    outputs:
      admit: ${{ steps.gate.outputs.admit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            .nvmrc
            scripts/writer-queue.mjs
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - name: Count the writer queue
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          WRITER_WORKFLOW: derive.yml
          FORCE: ${{ inputs.force && 'true' || '' }}
        run: node scripts/writer-queue.mjs gate

  derive:
    needs: gate
    if: needs.gate.outputs.admit == 'true'
    # The writer lock, runs waiting in arrival order (FEED-OPS-4; aggregate.yml explains the group). It stays on the
    # full data checkout: derive rebuilds and publishes every view from the whole tree it reads.
    concurrency:
      group: earthquakes-feed-writer
      cancel-in-progress: false
      queue: max
    # Pinned, not ubuntu-latest: ubuntu-latest moves to Ubuntu 26.04 from 2026-10-19
    # (actions/runner-images#14748). Move to ubuntu-26.04 deliberately, after a green test run.
    runs-on: ubuntu-24.04
    # 12, not 6: a failing Pages deploy alone runs ~3 min before erroring out. The deploy reads this budget
    # (job-timeout-minutes below, kept equal by tests/pages-deploy.test.ts) and retries only while 7 min are left.
    timeout-minutes: 12
    steps:
      # First, so the Pages deploy (.github/actions/derive-publish) counts the job's budget from about its start.
      - name: Note the job's start
        run: echo "FEED_JOB_STARTED_S=$(date -u +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: data
          path: .data
          fetch-depth: 1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Snapshot the silent-change baseline
        # As in aggregate.yml (src/live-baseline.ts): nothing writes the checkout before derive here, so the snapshot is
        # the event map derive reads.
        continue-on-error: true
        # About half a second (the event map of the window); a hang must not eat the job budget the deploy counts on.
        timeout-minutes: 2
        env:
          DATA_DIR: .data
          LIVE_BASELINE_DIR: ${{ runner.temp }}/live-baseline
        run: npx --no-install tsx src/live-baseline.ts
      - name: Derive and publish
        uses: ./.github/actions/derive-publish
        with:
          cf-api-token: ${{ secrets.CF_API_TOKEN }}
          cf-account-id: ${{ secrets.CF_ACCOUNT_ID }}
          job-started-at: ${{ env.FEED_JOB_STARTED_S }}
          job-timeout-minutes: 12
          feed-signing-key: ${{ secrets.FEED_SIGNING_KEY }}
          feed-signing-kid: ${{ vars.FEED_SIGNING_KID }}
          r2-access-key-id: ${{ secrets.R2_ACCESS_KEY_ID }}
          r2-secret-access-key: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          r2-s3-endpoint: ${{ vars.R2_S3_ENDPOINT }}
          r2-bucket: ${{ vars.R2_BUCKET }}
          r2-public-base: ${{ vars.R2_PUBLIC_BASE }}
