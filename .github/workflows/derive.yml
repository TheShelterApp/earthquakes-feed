name: derive

# Phase 2 alone: rebuild derived views (rolling summaries, per-day partitions + Pages day files, manifest) as a pure
# function of the log, then publish (.github/actions/derive-publish). Since FEED-OPS-4 (round 14) every aggregate run
# ends with these same steps on its own checkout, so this workflow is no longer triggered by aggregate (workflow_run)
# or by a cron: each of those runs was a second arrival in the writer group every 5 minutes, and a pending one was
# cancelled by the next arrival (41 derive runs in the week 2026-09-29 → 10-06). Dispatch it by hand to republish
# without fetching: gh workflow run derive.yml -R TheShelterApp/earthquakes-feed
on:
  workflow_dispatch:
    inputs:
      force:
        description: 'Join the writer queue even when 2 writer runs already wait (README.md "Writer group"): every aggregate run waits behind it'
        type: boolean
        default: false
      retrack:
        # Storage phase 3b's rollback only (APIs.md "Rollback after 3b"): with aggregate.yml disabled and the writer
        # queue empty, this run commits the hydrated event map back into git as hour shards (the sentinel and the ignore
        # lines removed); the revert to phase 3a is merged next, then aggregate.yml enabled again. Never otherwise. The
        # job checks both preconditions itself before it hydrates (writer-queue.mjs retrack-check) and stops otherwise.
        description: 'ROLLBACK ONLY (APIs.md "Rollback after 3b"): commit the event map back into git; aggregate.yml must be disabled first'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  # Outside every group: the writer lock is taken by the job below, and only when this gate admits it (SHLTR-149;
  # scripts/writer-queue.mjs, README.md "Writer group").
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      # The repository's unfinished runs and their jobs (the writer queue).
      actions: read
    outputs:
      admit: ${{ steps.gate.outputs.admit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            .nvmrc
            scripts/writer-queue.mjs
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Count the writer queue
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          WRITER_WORKFLOW: derive.yml
          FORCE: ${{ inputs.force && 'true' || '' }}
        run: node scripts/writer-queue.mjs gate

  derive:
    needs: gate
    if: needs.gate.outputs.admit == 'true'
    # The writer lock, runs waiting in arrival order (FEED-OPS-4; aggregate.yml explains the group). It stays on the
    # full data checkout: derive rebuilds and publishes every view from the whole tree it reads.
    concurrency:
      group: earthquakes-feed-writer
      cancel-in-progress: false
      queue: max
    # Pinned, not ubuntu-latest: ubuntu-latest moves to Ubuntu 26.04 from 2026-10-19
    # (actions/runner-images#14748). Move to ubuntu-26.04 deliberately, after a green test run.
    runs-on: ubuntu-24.04
    # 12, not 6: a failing Pages deploy alone runs ~3 min before erroring out. The deploy reads this budget
    # (job-timeout-minutes below, kept equal by tests/pages-deploy.test.ts) and retries only while 7 min are left.
    timeout-minutes: 12
    # Restated in full at job level (aggregate.yml says why): the push, the workflow state and the runs for the
    # re-track's precondition check (rollback only), and an OIDC token for the state store's hydrate (read only:
    # derive's prune of the generation is a local edit, src/event-map-store.ts).
    permissions:
      contents: write
      actions: read
      id-token: write
    steps:
      # First, so the Pages deploy (.github/actions/derive-publish) counts the job's budget from about its start.
      - name: Note the job's start
        run: echo "FEED_JOB_STARTED_S=$(date -u +%s)" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: data
          path: .data
          fetch-depth: 1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Check the re-track's preconditions (rollback only)
        # APIs.md "Rollback after 3b", steps 1 and 2, enforced before anything is hydrated or committed: aggregate.yml
        # disabled (`disabled_manually`) and no aggregate run left in the writer queue (holding, waiting or about to
        # enter: disabling a workflow does not cancel its queued runs). A phase-3b aggregate run after the re-track would
        # find the shards tracked and make the transition again (the 12 MB of shards twice in the history), and fail
        # closed once the revert is merged. Fails closed when either cannot be read (scripts/writer-queue.mjs decideRetrack).
        if: inputs.retrack
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/writer-queue.mjs retrack-check
      - run: npm ci
      - name: State hydrate
        # As in aggregate.yml (storage phase 3b): the generation's days from the state store into the checkout, which
        # holds none of them; fail closed (a 60 s deadline over the store requests, AUTHORITATIVE_HYDRATE_POLICY; this
        # timeout only the backstop). FEED_STATE_BACKEND is set here: the store has no kill switch since 3b.
        timeout-minutes: 3
        env:
          DATA_DIR: .data
          FEED_STATE_BACKEND: worker
          FEED_STATE_URL: https://feed-state.theshelter.app
          FEED_STATE_AUDIENCE: earthquakes-feed-state
          FEED_STATE_MARKER_DIR: ${{ runner.temp }}/state-shadow
        run: npx --no-install tsx src/event-map-store.ts hydrate
      - name: Upload the state report
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: state-shadow
          path: ${{ runner.temp }}/state-shadow
          if-no-files-found: ignore
          retention-days: 1
      - name: Re-track the event map (rollback only)
        # APIs.md "Rollback after 3b", step 3: the hydrated event map back into git as phase 3a's hour shards, byte for
        # byte the generation's days (src/event-map-store.ts retrack checks each), the sentinel and the .gitignore lines
        # removed, committed and pushed under this job's writer lock. The derive below then commits on top as usual.
        if: inputs.retrack
        working-directory: .data
        run: |
          git config user.name  "earthquakes-feed-bot"
          git config user.email "bot@users.noreply.github.com"
          ( cd "$GITHUB_WORKSPACE" && DATA_DIR=.data npx --no-install tsx src/event-map-store.ts retrack )
          git commit -q -m "retrack: the event map back in git (storage phase 3b rollback) @ $(date -u +%FT%TZ)"
          PUSH_ATTEMPTS=5 PUSH_BACKOFF_S=5 bash "$GITHUB_WORKSPACE/scripts/push-data.sh"
      - name: Snapshot the silent-change baseline
        # As in aggregate.yml (src/live-baseline.ts), after the hydrate: nothing else writes the checkout before derive
        # here, so the snapshot is the event map derive reads.
        continue-on-error: true
        # About half a second (the event map of the window), plus at most 45 s of Pages requests after a failed derive;
        # a hang must not eat the job budget the deploy counts on.
        timeout-minutes: 2
        env:
          DATA_DIR: .data
          LIVE_BASELINE_DIR: ${{ runner.temp }}/live-baseline
        run: npx --no-install tsx src/live-baseline.ts
      - name: Derive and publish
        uses: ./.github/actions/derive-publish
        with:
          cf-api-token: ${{ secrets.CF_API_TOKEN }}
          cf-account-id: ${{ secrets.CF_ACCOUNT_ID }}
          job-started-at: ${{ env.FEED_JOB_STARTED_S }}
          job-timeout-minutes: 12
          feed-signing-key: ${{ secrets.FEED_SIGNING_KEY }}
          feed-signing-kid: ${{ vars.FEED_SIGNING_KID }}
          r2-access-key-id: ${{ secrets.R2_ACCESS_KEY_ID }}
          r2-secret-access-key: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          r2-s3-endpoint: ${{ vars.R2_S3_ENDPOINT }}
          r2-bucket: ${{ vars.R2_BUCKET }}
          r2-public-base: ${{ vars.R2_PUBLIC_BASE }}
