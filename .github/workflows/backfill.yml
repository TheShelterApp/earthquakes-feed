name: backfill

# Walks history backward, one paced window per provider per run, into day partitions
# (idempotent via the same dedup path), toward a 3-year target. Cold months are rolled
# to Releases by archive.yml so the tree stays bounded. A dispatch with start/end is a
# one-off fill of that range and does NOT move the auto-cursor.
on:
  schedule:
    - cron: '41 * * * *'
  workflow_dispatch:
    inputs:
      starttime:
        description: 'ISO start (e.g. 2025-01-01T00:00:00Z); one-off, does not move the cursor'
        required: false
      endtime:
        description: 'ISO end'
        required: false
      providers:
        description: 'Comma-separated provider ids (blank = all eligible)'
        required: false
      minmag:
        description: 'Minimum magnitude (blank = provider default)'
        required: false
      force:
        description: 'Join the writer queue even when 2 writer runs already wait (README.md "Writer group"): every aggregate run waits behind it'
        type: boolean
        default: false
      dry_run:
        description: 'Dry run: print the plan (each window, each provider and day: fetch or retention) and nothing else: no request, no write, no marker, no writer lock'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  # A dry run (input dry_run): the plan of this dispatch (src/backfill.ts BACKFILL_PHASE=plan: every window to fetch, and
  # every provider and day, `fetch` or `retention` for a source's days before its retention, SHLTR-146), from a sparse
  # checkout of the index files. No request to any source, no write, no marker; outside the writer group.
  plan:
    if: ${{ inputs.dry_run }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: data
          path: .data
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: /knowledge/index/*.json
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Plan
        env:
          DATA_DIR: .data
          BACKFILL_PHASE: plan
          BACKFILL_PLAN_OUT: backfill-plan.json
          BACKFILL_STARTTIME: ${{ inputs.starttime }}
          BACKFILL_ENDTIME: ${{ inputs.endtime }}
          BACKFILL_PROVIDERS: ${{ inputs.providers }}
        run: npx --no-install tsx src/backfill.ts
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: backfill-plan
          path: backfill-plan.json
          if-no-files-found: error
          retention-days: 3

  # Outside every group: the writer lock is taken by the `backfill` job below, and only when this gate admits it
  # (SHLTR-149; scripts/writer-queue.mjs, README.md "Writer group"). Pacing many windows: dispatch at most 2 at a time;
  # a third is refused here in seconds with an ::error:: that names what waits. A refused walk (the hourly cron, or the
  # heartbeat Worker's dispatch without a window) is a ::warning:: and a green run: the next tick walks on.
  gate:
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      # The repository's unfinished runs and their jobs (the writer queue).
      actions: read
    outputs:
      admit: ${{ steps.gate.outputs.admit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            .nvmrc
            scripts/writer-queue.mjs
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - name: Count the writer queue
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          WRITER_WORKFLOW: backfill.yml
          FORCE: ${{ inputs.force && 'true' || '' }}
          # A walk run (no dispatched window) is retried by the next tick; a dispatched window is not.
          RETRIED: ${{ (github.event_name == 'schedule' || !(inputs.starttime && inputs.endtime)) && 'true' || '' }}
        run: node scripts/writer-queue.mjs gate

  backfill:
    needs: gate
    if: needs.gate.outputs.admit == 'true'
    # The writer lock, runs waiting in arrival order (FEED-OPS-4; aggregate.yml explains the group). It holds the group
    # for seconds: the backfill itself takes 0–2 s (its requests included) and the data checkout below is sparse.
    concurrency:
      group: earthquakes-feed-writer
      cancel-in-progress: false
      queue: max
    # Pinned, not ubuntu-latest: ubuntu-latest moves to Ubuntu 26.04 from 2026-10-19
    # (actions/runner-images#14748). Move to ubuntu-26.04 deliberately, after a green test run.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Sparse and blobless (SHLTR-149): the full checkout of `data` took 94–101 s of the 2 min 15 s each backfill held
      # the writer lock in the 2026-11-08 incident, while the backfill step took 0–2 s. A backfill reads only the index
      # files and the day partitions of its windows; the index files come now, the months after the plan below.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: data
          path: .data
          fetch-depth: 1
          sparse-checkout: /knowledge/index/*.json
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # The same plan as the Backfill step (the same environment, the same checkout), printed as the months it reads
      # and writes (a day of margin on each side) and added to the sparse checkout. The Backfill step refuses to run when
      # a partition of its range is in the tree but not checked out (src/backfill.ts assertCheckedOut), and the commit
      # step's `git add` fails on a file written outside these months: a sparse miss never reads as an empty day.
      - name: Check out the months of this run's windows
        env:
          DATA_DIR: .data
          BACKFILL_PHASE: paths
          BACKFILL_PATHS_OUT: ${{ runner.temp }}/backfill-paths.txt
          BACKFILL_STARTTIME: ${{ inputs.starttime }}
          BACKFILL_ENDTIME: ${{ inputs.endtime }}
          BACKFILL_PROVIDERS: ${{ inputs.providers }}
        run: |
          npx --no-install tsx src/backfill.ts
          cat "$BACKFILL_PATHS_OUT"
          if [ -s "$BACKFILL_PATHS_OUT" ]; then git -C .data sparse-checkout add --stdin < "$BACKFILL_PATHS_OUT"; fi
      - name: Backfill
        id: run
        env:
          DATA_DIR: .data
          # gh release download: lets backfill pull archived (cold) months back to merge a
          # newly-added source into them (re-materialize + flag month for re-roll).
          GH_TOKEN: ${{ github.token }}
          BACKFILL_STARTTIME: ${{ inputs.starttime }}
          BACKFILL_ENDTIME: ${{ inputs.endtime }}
          BACKFILL_PROVIDERS: ${{ inputs.providers }}
          # Same reason as aggregate.yml: the concurrent fetches' getaddrinfo lookups queue on libuv's
          # 4-thread pool on this runner, so late fetches wait seconds for DNS alone (PF-5c). Must be set
          # before node starts; an empty value would mean ONE thread.
          UV_THREADPOOL_SIZE: '64'
        run: npx --no-install tsx src/backfill.ts
      - name: Validate log delta
        env:
          DATA_DIR: .data
        run: npx --no-install tsx src/validate.ts
      - name: Commit & push
        working-directory: .data
        run: |
          git config user.name  "earthquakes-feed-bot"
          git config user.email "bot@users.noreply.github.com"
          # A sparse checkout, so no pathspec: `git add events knowledge` exits 1 whenever a pathspec matches only paths
          # outside the checkout (every walk with nothing to fill checks out no month: 2026-11-14 15:43Z). `-A` alone
          # stages the changes inside the checkout; a NEW file written outside it still makes `git add` exit 1 and the
          # step fails before anything is committed, and a rewrite of a tracked day that is not checked out is never
          # staged (tests/backfill-sparse.test.ts).
          git add -A
          git commit -m "backfill: @ $(date -u +%FT%TZ)" || { echo 'no changes'; exit 0; }
          # Fail-loud push loop (H3; tests/push-data.test.ts): a concurrent writer's commit is rebased onto, a conflict
          # aborts the rebase and fails.
          bash "$GITHUB_WORKSPACE/scripts/push-data.sh"
      # The signal AFTER the durable work: backfill exits 0 and drops a marker instead of failing
      # its own step, because a failed step skips every later step without `if:` — the commit
      # would never land and each run would repeat and re-discard identical work.
      # The marker states every standing block, on every run: an unreadable archived month, a dispatched window not
      # filled yet (knowledge/index/backfill.json `dispatched`: open until dispatched ranges that answered in full
      # cover it), a provider whose walk keeps failing at a one-day window. It keeps the run green (alerting plan of
      # 2026-10-22): a warning here, and the marker as the artifact walk-blocked-backfill, which the health workflow's
      # feed evaluator (scripts/feed-health.mjs) files on the "[health] feed" board as walks:backfill:<source> (a P3:
      # one comment). A run whose backfill step finished with nothing blocked uploads a marker without a blocked line
      # (only a "#" line): the board resolves on the next health run, not after the 26 h hold.
      - name: Warn if backfill was blocked or a walk is stalled
        if: always()
        run: |
          if [ -f backfill-blocked.txt ]; then
            cat backfill-blocked.txt
            echo '::warning::backfill: blocked or stalled (see above); this run'"'"'s other work was still committed, and the health workflow files the marker on the "[health] feed" board'
          fi
      - name: Mark a run with nothing blocked
        if: always() && steps.run.outcome == 'success'
        run: '[ -f backfill-blocked.txt ] || echo "# nothing blocked: run ${{ github.run_id }}" > backfill-blocked.txt'
      - name: Upload the blocked marker (read by the health workflow)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: walk-blocked-backfill
          path: backfill-blocked.txt
          if-no-files-found: ignore
          retention-days: 3
          overwrite: true
