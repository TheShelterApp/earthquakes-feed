name: health

# Watchdogs, run every 15 min by the heartbeat Worker (workflow_dispatch at :07/:22/:37/:52)
# plus this file's own hourly cron as a fallback. Two independent jobs:
#   health — the FEED: checks the LIVE Pages manifest (the only check that catches every
#            stale mode: dead cron, failed derive, failed deploy) and per-provider degradation.
#            On failure: opens/refreshes the "[health] feed unhealthy" issue and fails the run.
#   alerts — The Shelter's ALERT PIPELINE (alerts-gateway on Cloudflare): scripts/alerts-watchdog.mjs
#            reads data.theshelter.app/alerts/status.json (+ optional account usage) and fails the
#            run; GitHub's failed-workflow email is its alarm (no issue). It also fails when the feed
#            manifest the gateway last read is over 30 min old or the config bundle over 10 days
#            (fields of round-13 gateways; absent = skipped). See README "Health watchdogs".
#   platform — The Shelter's API and config Workers: scripts/platform-watchdog.mjs GETs
#            api.theshelter.app/v1/health and config.theshelter.app/healthz and fails the run when
#            either is down (X-4: before 2026-10-04 nothing noticed). Same alarm: the failed-run email.
on:
  schedule:
    - cron: '25 * * * *'
  workflow_dispatch:
    inputs:
      watchdog_selftest:
        description: 'Alert watchdog selftest: force an impossible headroom limit so the alerts job MUST fail (proves the red path + email)'
        type: boolean
        default: false

permissions:
  contents: read
  issues: write
  # reads this run's own created_at, to measure how long it sat in the runner queue
  actions: read

jobs:
  health:
    # Pinned, not ubuntu-latest: ubuntu-latest moves to Ubuntu 26.04 from 2026-10-19
    # (actions/runner-images#14748). Move to ubuntu-26.04 deliberately, after a green test run.
    runs-on: ubuntu-24.04
    # 10, not 5: the queue-stall branch below can spend ~260s on retries plus its deliberate
    # 60s re-read, and a step killed mid-flight never writes GITHUB_OUTPUT — which would skip
    # both issue steps, leaving an open health issue neither refreshed nor closed.
    timeout-minutes: 10
    steps:
      - name: Check live feed freshness + providers
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -e
          # Fetch to files, not shell vars: the manifest is >128 KB and passing it as an
          # argv element trips MAX_ARG_STRLEN → `exec: Argument list too long` (E2BIG).
          # Retried like the others: this is the ONE fetch whose failure alone raises the alarm, so
          # a single edge 502 or TCP reset would open "[health] feed unhealthy" on a healthy feed.
          curl -sf --retry-all-errors --retry 3 --retry-delay 3 --max-time 20 "https://earthquakes-feed.theshelter.app/v1/manifest.json" -o manifest.json \
            || { echo "problem=manifest unreachable" >> "$GITHUB_OUTPUT"; exit 0; }
          # --retry-all-errors + atomic swap: plain --retry covers only timeouts and 408/429/5xx,
          # so a connection reset made exactly ONE attempt — and -o had already truncated the file,
          # so JSON.parse threw, s stayed null, and the watchdog opened "[health] feed unhealthy"
          # on a perfectly healthy feed. Stage to .new; the real file changes only on curl exit 0.
          curl -sf --retry-all-errors --retry 3 --retry-delay 3 --max-time 20 "https://earthquakes-feed.theshelter.app/v1/status.json" -o status.json.new \
            && mv status.json.new status.json || rm -f status.json.new
          # timeout-minutes bounds execution, not queue wait: on 2026-07-25 the hosted-runner
          # queue stalled 1h54m, derive starved, and the second watchdog run double-reported the
          # same incident off a manifest published before the backlog drained. Re-read once after
          # a long queue so publishing has a chance to catch up before we judge staleness.
          # Every step degrades to queued=0 rather than dying: a watchdog that kills itself on a
          # bad timestamp takes its own alarm down with it, which is the failure class we're fixing.
          CREATED=$(gh api "repos/${{ github.repository }}/actions/runs/${{ github.run_id }}" --jq .created_at || true)
          CREATED_S=$(date -u -d "$CREATED" +%s 2>/dev/null || echo 0)
          QUEUED=0
          if [ "$CREATED_S" -gt 0 ]; then QUEUED=$(( $(date -u +%s) - CREATED_S )); fi
          if [ "$QUEUED" -gt 600 ]; then
            sleep 60
            # Same atomic swap, and it matters more here: a mid-transfer abort used to truncate the
            # already-good manifest, the node script then died on JSON.parse under `bash -e` before
            # writing GITHUB_OUTPUT, and both issue steps were skipped — an open health issue would
            # never be refreshed or closed. A failed re-fetch now just keeps the first fetch's copy.
            curl -sf --retry-all-errors --retry 3 --retry-delay 3 --max-time 20 "https://earthquakes-feed.theshelter.app/v1/manifest.json" -o manifest.json.new \
              && mv manifest.json.new manifest.json || rm -f manifest.json.new
          fi
          QUEUED_S="$QUEUED" node -e '
            const fs = require("fs");
            const m = JSON.parse(fs.readFileSync("manifest.json", "utf8"));
            // null, not {}: an unfetchable status.json used to yield total=1 / degraded=[], so the
            // provider check passed trivially — a missed alarm, not a false one.
            let s = null;
            try { const raw = fs.readFileSync("status.json", "utf8"); if (raw.trim()) s = JSON.parse(raw); } catch {}
            const queuedS = Number(process.env.QUEUED_S || 0);
            const ageS = (Date.now() - m.generated) / 1000;
            const staleAfter = (m.freshness && m.freshness.stale_after_seconds) || 1800;
            const degraded = (s && s.degraded) || [];
            // FEED-3: a silent source (it answers, with no rows, for longer than its activity budget) is listed in
            // `silent` and also counted in `degraded`. It is reported in its own issue below and kept out of the
            // systemic count, so a few long-dead sources cannot push routine flapping over the limit. A silent source
            // whose fetch FAILS in this run still counts as failing: silence is measured from its last rows, so a
            // source that has been down past its budget is silent too, and a long systemic outage must not leave the
            // count once it is 12 h old.
            const silent = (s && s.silent && typeof s.silent === "object" && !Array.isArray(s.silent)) ? s.silent : {};
            const silentIds = Object.keys(silent).sort();
            // Round 14: a FROZEN source answers with rows whose newest origin stands still past its window plus budget
            // (src/activity.ts). Reported with the silent ones, kept out of the systemic count the same way.
            const frozen = (s && s.frozen && typeof s.frozen === "object" && !Array.isArray(s.frozen)) ? s.frozen : {};
            const frozenIds = Object.keys(frozen).sort();
            const quiet = (id) => id in silent || id in frozen;
            const failing = degraded.filter((id) => !quiet(id) || (s && s.providers && s.providers[id] && s.providers[id].ok === false));
            const total = Object.keys((s && s.providers) || {}).length || 1;
            // Scale with the roster: a handful of slow national FDSN nodes flap constantly and
            // the feed stays fully covered by the global catalogs — only a systemic share down
            // (~30%, floor 8) signals a real problem. Manifest staleness is the primary signal.
            const degLimit = Math.max(8, Math.ceil(total * 0.3));
            console.log(`age=${Math.round(ageS)}s (stale_after=${staleAfter}) head_seq=${m.head_seq} events=${m.event_count} failing=${failing.length}/${total} limit=${degLimit} [${failing.join(",")}] silent=[${silentIds.join(",")}] frozen=[${frozenIds.join(",")}] queued=${queuedS}s`);
            const hours = (x) => (typeof x === "number" ? Math.round(x) : "?");
            const silentText = silentIds.map((id) => {
              const e = silent[id] || {};
              return `${id}: no rows for ${hours(e.silent_hours)} h (budget ${hours(e.budget_hours)} h, last rows ${e.last_non_empty_at || "not since " + (e.counted_from || "?")})`;
            });
            for (const t of silentText) console.log(`::warning::silent provider ${t}`);
            const frozenText = frozenIds.map((id) => {
              const e = frozen[id] || {};
              return `${id}: frozen, ${e.rows ?? "?"} rows whose newest origin (${e.newest_origin || "?"}) is ${hours(e.newest_origin_age_hours)} h old (window ${hours(e.window_hours)} h + budget ${hours(e.budget_hours)} h)`;
            });
            for (const t of frozenText) console.log(`::warning::frozen provider ${t}`);
            // The issue below lists both kinds; its set marker names a frozen one as frozen:<id>.
            const quietSet = [...silentIds, ...frozenIds.map((id) => `frozen:${id}`)].join(",");
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `status_read=${s ? "1" : ""}\nsilent_set=${quietSet}\nsilent=${[...silentText, ...frozenText].join("; ")}\n`);
            // FEED-SEC-1: the leaf certificate of each pinned source (status.json tls_leaves, round 14). Under 7 days a
            // warning and the "[health] pinned certificate expiring" issue below; never a red run (the source itself
            // fails once the leaf expires, and the failing count sees that).
            const leaves = (s && s.tls_leaves && typeof s.tls_leaves === "object") ? s.tls_leaves : {};
            const expiring = Object.keys(leaves).sort().filter((id) => typeof leaves[id].days_left === "number" && leaves[id].days_left < 7);
            const leafText = expiring.map((id) => {
              const l = leaves[id];
              return `${id}: leaf ${l.subject || "?"} (issuer ${l.issuer || "?"}) expires ${l.not_after}, in ${l.days_left} days (read ${l.seen_at})`;
            });
            for (const t of leafText) console.log(`::warning::pinned certificate ${t}`);
            console.log(`tls_leaf_days=[${Object.keys(leaves).sort().map((id) => `${id}:${leaves[id].days_left}`).join(",")}]`);
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `tls_set=${expiring.join(",")}\ntls=${leafText.join("; ")}\n`);
            const problems = [];
            // Name the queue in the alarm: a stall upstream of us reads as broken publishing.
            const queueNote = queuedS > 600 ? ` — this run itself waited ${Math.round(queuedS / 60)} min in the runner queue` : "";
            if (ageS > staleAfter) problems.push(`live manifest is ${Math.round(ageS / 60)} min stale (contract: ${staleAfter / 60} min)${queueNote}`);
            if (!s) problems.push("status.json unreachable — provider health unknown");
            else if (failing.length >= degLimit) problems.push(`${failing.length}/${total} providers failing: ${failing.join(", ")}`);
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `problem=${problems.join("; ")}\n`);
          '
      - name: Silent providers issue (opened, updated when the set changes, closed when none; never fails the run)
        # A silent source loses events quietly (NOA, 2026-09-24 → 10-04: 352 Greek events) but is usually one
        # agency, not an outage of the feed: an issue (GitHub emails it) instead of a red run every 15 minutes. Frozen
        # sources (rows, but the newest origin stands still; round 14) are listed here too, as frozen:<id> in the set.
        # An unreadable status.json changes nothing (state unknown). The entries are joined with "; " for the
        # one-line step output and split back into a list here, so an entry itself never contains a semicolon.
        # continue-on-error: a GitHub API error while filing the issue must not turn a healthy run red.
        if: steps.check.outputs.status_read == '1'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          SILENT: ${{ steps.check.outputs.silent }}
          SILENT_SET: ${{ steps.check.outputs.silent_set }}
        run: |
          TITLE="[health] silent providers"
          NUM=$(gh issue list --repo "${{ github.repository }}" --state open --search "$TITLE in:title" --json number --jq '.[0].number // empty')
          RUN="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          if [ -n "$SILENT_SET" ]; then
            BODY="Automated watchdog: these sources answer with no rows for longer than their activity budget, or (frozen) with rows whose newest origin has stood still past their query window plus their frozen budget (src/activity.ts, providers/registry.json \`activityBudgetHours\` / \`frozenBudgetHours\`). Their events reach the feed only through other agencies.

          $(printf '%s\n' "$SILENT" | tr ';' '\n' | sed 's/^ */- /')

          silent-set: ${SILENT_SET}
          Run: ${RUN} ($(date -u +%FT%TZ))"
            if [ -z "$NUM" ]; then
              gh issue create --repo "${{ github.repository }}" --title "$TITLE" --body "$BODY" --label bug
            else
              # Comment only when the set of silent sources changed: the hours grow every run.
              LAST=$(gh issue view "$NUM" --repo "${{ github.repository }}" --json body,comments --jq '[.body, (.comments[].body)] | map(select(test("silent-set: "))) | last // ""' | sed -n 's/^ *silent-set: //p' | tail -1)
              if [ "$LAST" != "$SILENT_SET" ]; then
                gh issue comment "$NUM" --repo "${{ github.repository }}" --body "$BODY"
              else
                echo "issue #$NUM already lists ${SILENT_SET}"
              fi
            fi
          elif [ -n "$NUM" ]; then
            gh issue comment "$NUM" --repo "${{ github.repository }}" --body "No silent source as of $(date -u +%FT%TZ) (run ${RUN}).

          silent-set: "
            gh issue close "$NUM" --repo "${{ github.repository }}"
          fi
      - name: Pinned certificate issue (opened when a pinned leaf has under 7 days, closed when none; never fails the run)
        # FEED-SEC-1: TMD and PHIVOLCS serve their leaf without the intermediate, so the feed pins the intermediate
        # (providers/tls). A renewed leaf under the same intermediate needs nothing; under another one the source fails
        # until the new intermediate is pinned (providers/tls/README.md). This gives a week's notice.
        if: steps.check.outputs.status_read == '1'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          TLS: ${{ steps.check.outputs.tls }}
          TLS_SET: ${{ steps.check.outputs.tls_set }}
        run: |
          TITLE="[health] pinned certificate expiring"
          NUM=$(gh issue list --repo "${{ github.repository }}" --state open --search "$TITLE in:title" --json number --jq '.[0].number // empty')
          RUN="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          if [ -n "$TLS_SET" ]; then
            BODY="Automated watchdog: the leaf certificate of these pinned sources expires within 7 days (status.json \`tls_leaves\`). When the host renews it, check its issuer: a new intermediate must be pinned (providers/tls/README.md), the same one needs nothing.

          $(printf '%s\n' "$TLS" | tr ';' '\n' | sed 's/^ */- /')

          tls-set: ${TLS_SET}
          Run: ${RUN} ($(date -u +%FT%TZ))"
            if [ -z "$NUM" ]; then
              gh issue create --repo "${{ github.repository }}" --title "$TITLE" --body "$BODY" --label bug
            else
              LAST=$(gh issue view "$NUM" --repo "${{ github.repository }}" --json body,comments --jq '[.body, (.comments[].body)] | map(select(test("tls-set: "))) | last // ""' | sed -n 's/^ *tls-set: //p' | tail -1)
              if [ "$LAST" != "$TLS_SET" ]; then
                gh issue comment "$NUM" --repo "${{ github.repository }}" --body "$BODY"
              else
                echo "issue #$NUM already lists ${TLS_SET}"
              fi
            fi
          elif [ -n "$NUM" ]; then
            gh issue comment "$NUM" --repo "${{ github.repository }}" --body "No pinned leaf expires within 7 days as of $(date -u +%FT%TZ) (run ${RUN}).

          tls-set: "
            gh issue close "$NUM" --repo "${{ github.repository }}"
          fi
      - name: Open/refresh health issue and fail
        if: steps.check.outputs.problem != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PROBLEM: ${{ steps.check.outputs.problem }}
        run: |
          TITLE="[health] feed unhealthy"
          BODY="Automated watchdog: ${PROBLEM}

          Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }} ($(date -u +%FT%TZ))"
          EXISTING=$(gh issue list --repo "${{ github.repository }}" --state open --search "$TITLE in:title" --json number,updatedAt --jq '.[0] | "\(.number // "") \(.updatedAt // "")"')
          NUM="${EXISTING%% *}"; UPD="${EXISTING##* }"
          if [ -n "$NUM" ]; then
            # The heartbeat drives this every 15 min, so a multi-hour outage would otherwise
            # leave 4 identical comments an hour on the same issue. Re-comment at most hourly;
            # the run still goes red below either way, so nothing is hidden.
            AGE=$(( $(date -u +%s) - $(date -u -d "$UPD" +%s 2>/dev/null || echo 0) ))
            if [ "$AGE" -gt 3600 ] || [ "$AGE" -lt 0 ]; then
              gh issue comment "$NUM" --repo "${{ github.repository }}" --body "$BODY"
            else
              echo "issue #$NUM already refreshed ${AGE}s ago — not commenting again"
            fi
          else
            gh issue create --repo "${{ github.repository }}" --title "$TITLE" --body "$BODY" --label bug
          fi
          echo "::error::$PROBLEM"
          exit 1
      - name: Close health issue on recovery
        if: steps.check.outputs.problem == ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          NUM=$(gh issue list --repo "${{ github.repository }}" --state open --search "[health] feed unhealthy in:title" --json number --jq '.[0].number // empty')
          if [ -n "$NUM" ]; then
            gh issue comment "$NUM" --repo "${{ github.repository }}" --body "Recovered — live feed healthy again as of $(date -u +%FT%TZ) (run ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})."
            gh issue close "$NUM" --repo "${{ github.repository }}"
          fi
      - name: Repository size (logged; a warning past the threshold, never a red run)
        # LIVE-2: the data branch's history only grows (nothing is ever rewritten) and GitHub asks to keep repositories
        # small; finished months of status/history and changes/ leave the tree (archive.yml), so the growth is the
        # observation log, the day partitions and the current month's logs. GitHub reports `size` in KB.
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          # 6 GB: 5.48 GB on 2026-10-04.
          REPO_SIZE_WARN_KB: '6000000'
        run: |
          KB=$(gh api "repos/${{ github.repository }}" --jq .size || true)
          case "$KB" in ''|*[!0-9]*) echo "repository size: unknown"; exit 0;; esac
          GB=$(awk -v kb="$KB" 'BEGIN { printf "%.2f", kb / 1e6 }')
          echo "repository size: ${GB} GB (${KB} KB, warning above ${REPO_SIZE_WARN_KB} KB)"
          if [ "$KB" -gt "$REPO_SIZE_WARN_KB" ]; then
            echo "::warning title=Repository size::the repository is ${GB} GB, over the ${REPO_SIZE_WARN_KB} KB threshold: check what grows (gh api repos/${{ github.repository }} --jq .size; the data branch tree by top-level directory)"
          fi

  alerts:
    # The alert-pipeline watchdog. A separate job on purpose: it runs in parallel with the feed
    # check, never touches the feed's health issue, and a red here is attributable at a glance.
    # It lives in GitHub (not on Cloudflare) so it still fires when Cloudflare is the problem.
    name: alert pipeline
    runs-on: ubuntu-24.04
    # The script bounds itself: 3 attempts x 15 s + 7 s backoff for status.json, the same for the
    # optional usage query (20 s per attempt). 5 min leaves room for checkout + setup-node.
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          sparse-checkout: scripts
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Check alert pipeline (status.json + optional free-tier usage)
        env:
          # Optional (owner): a read-only Cloudflare token with Account Analytics: Read. Unset -> the
          # usage half is skipped silently. The account queried is the CF_ANALYTICS_ACCOUNT_ID variable
          # when set, else the repo's CF_ACCOUNT_ID secret (the one the Pages deploy uses). A token that
          # cannot see that account fails the job as "misconfigured" instead of passing silently.
          CF_ANALYTICS_TOKEN: ${{ secrets.CF_ANALYTICS_TOKEN }}
          CF_ACCOUNT_ID: ${{ vars.CF_ANALYTICS_ACCOUNT_ID || secrets.CF_ACCOUNT_ID }}
          WATCHDOG_SELFTEST: ${{ inputs.watchdog_selftest && '1' || '' }}
        # Exit 0 healthy, 1 unhealthy, 2 status.json unreadable after retries (state unknown),
        # 3 watchdog misconfigured. Any non-zero exit fails the run; the ::error:: annotations say which.
        run: node scripts/alerts-watchdog.mjs

  platform:
    # API and config Workers, up or down. A job of its own, like `alerts`: a red here names the host at a glance,
    # and it runs from GitHub so it still fires when Cloudflare is the problem.
    name: api and config
    runs-on: ubuntu-24.04
    # 2 GETs x 3 attempts x 15 s + 7 s backoff, in parallel; 3 min leaves room for checkout + setup-node.
    timeout-minutes: 3
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          sparse-checkout: scripts
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      # Exit 0 healthy, 1 a host is down or unhealthy, 3 misconfigured; the ::error:: annotations say which.
      - name: Check api.theshelter.app and config.theshelter.app
        run: node scripts/platform-watchdog.mjs
