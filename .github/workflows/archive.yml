name: archive

# Rolls fully-cold event-months (older than the 120-day hot window) into monthly
# tar.zst GitHub Release assets, then removes them from the tree — keeping the data
# branch (and consumer clones) bounded while backfill grows history. Releases are
# un-metered cold storage. Runs monthly + on demand. Since 2026-10-04 (LIVE-2) it also
# moves finished months of status/history and changes/ into immutable gzip assets of
# the `logs-YYYY-MM` releases (src/log-archive.ts); only the current month stays.
on:
  schedule:
    # Every 6h so cold months roll promptly while backfill is actively growing history.
    - cron: '17 */6 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Join the writer queue even when 2 writer runs already wait (README.md "Writer group"): every aggregate run waits behind it'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  # Outside every group: the writer lock is taken by the job below, and only when this gate admits it (SHLTR-149;
  # scripts/writer-queue.mjs, README.md "Writer group").
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      # The repository's unfinished runs and their jobs (the writer queue).
      actions: read
    outputs:
      admit: ${{ steps.gate.outputs.admit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            .nvmrc
            scripts/writer-queue.mjs
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - name: Count the writer queue
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          WRITER_WORKFLOW: archive.yml
          FORCE: ${{ inputs.force && 'true' || '' }}
          # A refused scheduled run is a warning: the next 6-hourly run rolls the same months.
          RETRIED: ${{ github.event_name == 'schedule' && 'true' || '' }}
        run: node scripts/writer-queue.mjs gate

  archive:
    needs: gate
    if: needs.gate.outputs.admit == 'true'
    # The writer lock, runs waiting in arrival order (FEED-OPS-4; aggregate.yml explains the group). It stays on the
    # full data checkout: archive scans every in-tree month for cold ones, rolls status/history and changes/ and prunes
    # the tree, so it reads most of `data`; it runs 4 times a day.
    concurrency:
      group: earthquakes-feed-writer
      cancel-in-progress: false
      queue: max
    # Pinned, not ubuntu-latest: ubuntu-latest moves to Ubuntu 26.04 from 2026-10-19
    # (actions/runner-images#14748). Move to ubuntu-26.04 deliberately, after a green test run.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: data
          path: .data
          fetch-depth: 1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Archive cold months to Releases
        id: run
        env:
          DATA_DIR: .data
          GH_TOKEN: ${{ github.token }}
        run: npx --no-install tsx src/archive.ts
      - name: Commit & push (tree pruned, index updated)
        working-directory: .data
        run: |
          git config user.name  "earthquakes-feed-bot"
          git config user.email "bot@users.noreply.github.com"
          # status + changes: LIVE-2 removes finished months' run logs (src/log-archive.ts); `git add` stages removals.
          git add events knowledge status changes
          git commit -m "archive: roll cold months to Releases @ $(date -u +%FT%TZ)" || { echo 'no changes'; exit 0; }
          # Fail-loud push loop (H3; tests/push-data.test.ts): a concurrent writer's commit is rebased onto, a conflict
          # aborts the rebase and fails.
          bash "$GITHUB_WORKSPACE/scripts/push-data.sh"
      # LAST, and `always()`: a blocked month must not stop the commit above from landing. The
      # script deliberately exits 0 and leaves a marker instead, so the durable state (index
      # entries for uploaded assets, pruned tree) is safe on the data branch first. Failing
      # earlier would skip the commit and make every later run repeat the same work.
      # A blocked month keeps the run green (alerting plan of 2026-10-22): a warning here, and the marker as the artifact
      # walk-blocked-archive, which the health workflow's feed evaluator (scripts/feed-health.mjs) files on the
      # "[health] feed" board as walks:archive:<source> (a P3: one comment). A script that throws still fails its own
      # step, and the run. A blocked month stays flagged and is tried again by every run, so a run that looked at every
      # cold month (output `complete`: the per-run cap did not stop it) states every standing block (SHLTR-151), and
      # with nothing blocked uploads a marker without a blocked line (only a "#" line): the board resolves on the next
      # health run; the 26 h hold is the fallback.
      - name: Warn if any month was blocked
        if: always()
        run: |
          if [ -f archive-blocked.txt ]; then
            cat archive-blocked.txt
            echo '::warning::archive: one or more months blocked (see above), and the health workflow files the marker on the "[health] feed" board; check whether the commit step above ran, it is skipped if the script itself threw'
          fi
      - name: Mark a run with nothing blocked
        if: always() && steps.run.outcome == 'success' && steps.run.outputs.complete == 'true'
        run: '[ -f archive-blocked.txt ] || echo "# nothing blocked: run ${{ github.run_id }}" > archive-blocked.txt'
      - name: Upload the blocked marker (read by the health workflow)
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: walk-blocked-archive
          path: archive-blocked.txt
          if-no-files-found: ignore
          retention-days: 3
          overwrite: true
