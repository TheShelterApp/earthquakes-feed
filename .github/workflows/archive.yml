name: archive

# Rolls fully-cold event-months (older than the 120-day hot window) into monthly
# tar.zst GitHub Release assets, then removes them from the tree — keeping the data
# branch (and consumer clones) bounded while backfill grows history. Releases are
# un-metered cold storage. Runs monthly + on demand.
on:
  schedule:
    # Every 6h so cold months roll promptly while backfill is actively growing history.
    - cron: '17 */6 * * *'
  workflow_dispatch:

concurrency:
  group: earthquakes-feed-writer
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/checkout@v5
        with:
          ref: data
          path: .data
          fetch-depth: 1
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Archive cold months to Releases
        env:
          DATA_DIR: .data
          GH_TOKEN: ${{ github.token }}
        run: npx --no-install tsx src/archive.ts
      - name: Commit & push (tree pruned, index updated)
        working-directory: .data
        run: |
          git config user.name  "earthquakes-feed-bot"
          git config user.email "bot@users.noreply.github.com"
          git add events knowledge
          git commit -m "archive: roll cold months to Releases @ $(date -u +%FT%TZ)" || { echo 'no changes'; exit 0; }
          for i in 1 2 3; do
            git push origin HEAD:data && exit 0
            git fetch origin data
            # `|| true`: with no rebase started --abort exits 128 and bash -e would kill the step
            # before the annotation is emitted, losing the reason the push died.
            git rebase origin/data || { git rebase --abort || true; echo '::error::rebase conflict'; exit 1; }
          done
          echo '::error::push failed after 3 attempts'; exit 1
      # LAST, and `always()`: a blocked month must not stop the commit above from landing. The
      # script deliberately exits 0 and leaves a marker instead, so the durable state (index
      # entries for uploaded assets, pruned tree) is safe on the data branch before the job goes
      # red. Failing earlier would skip the commit and make every later run repeat the same work.
      - name: Fail if any month was blocked
        if: always()
        run: |
          if [ -f archive-blocked.txt ]; then
            cat archive-blocked.txt
            echo '::error::archive: one or more months blocked (see above) — check whether the commit step above ran, it is skipped if the script itself threw'
            exit 1
          fi
