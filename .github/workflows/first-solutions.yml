name: first-solutions

# The earliest-solutions side index (PF-5i P-3; APIs.md, Earliest solutions). Each run asks the sources that keep a
# version history (ComCat, GeoNet, INGV, ETHZ, USP, GEOFON, KNMI, IPGP, LMU) for the history of the reports the feed
# holds, one source per lane, at most one request per second per host, and uploads what it gets as gzip NDJSON chunks
# to the Release `first-solutions-YYYY-MM` of the event month. The `data` branch gets only the walk's cursor and the
# chunk list (knowledge/first_solutions/), written by the short `commit` job; the `collect` job, which spends up to 30
# minutes on requests, shares the deep-history walk's group, so the two never query a source at the same time. Neither
# job holds the writer lock (FEED-OPS-4, round 14): no other writer touches knowledge/first_solutions/, so the commit
# pushes on its own and rebases onto any writer that got there first. Until then the commit job waited for the lock
# and GitHub cancelled it whenever another writer queued behind it (10 of 126 runs in the week 2026-09-29 → 10-06,
# each after 31 minutes of requests); a commit job that fails anyway loses nothing: the next run's collect job takes
# its output over.
#
# Off until enabled: the scheduled runs go ahead only when the repository variable FIRST_SOLUTIONS_SCHEDULE is `on`
# (gh variable set FIRST_SOLUTIONS_SCHEDULE --body on -R TheShelterApp/earthquakes-feed); a manual dispatch always runs.
# The heartbeat Worker dispatches this workflow hourly at :48 with `tick=1` (heartbeat/src/worker.js), because GitHub
# delivers this repository's hourly crons about 4 times a day (backfill, derive and health each got 4 scheduled runs
# between 2026-09-30 16:40 and 2026-10-01 16:40 UTC); the cron below is the fallback when the Worker is down.
on:
  schedule:
    - cron: '50 * * * *'
  workflow_dispatch:
    inputs:
      tick:
        description: 'Set to 1 by the heartbeat Worker: then the run goes ahead only when FIRST_SOLUTIONS_SCHEDULE is on'
        required: false
      days:
        description: 'One-off slice: days (2026-06-15 or 2026-06-15..2026-06-20); blank = the walk'
        required: false
      sources:
        description: 'Comma-separated providers (blank = all)'
        required: false
      budget_minutes:
        description: 'Minutes of requests (blank = 30)'
        required: false

# One run at a time: a run reads the cursor the previous run's commit job wrote.
concurrency:
  group: earthquakes-feed-first-solutions
  cancel-in-progress: false

# actions: read lets the collect job read the previous run's `first-solutions-out` artifact: a run whose commit job was
# cancelled while it waited for the writer lock is taken over by the next run instead of being done again.
permissions:
  contents: write
  actions: read

jobs:
  collect:
    if: vars.FIRST_SOLUTIONS_SCHEDULE == 'on' || (github.event_name == 'workflow_dispatch' && inputs.tick != '1')
    # Pinned, not ubuntu-latest: ubuntu-latest moves to Ubuntu 26.04 from 2026-10-19
    # (actions/runner-images#14748). Move to ubuntu-26.04 deliberately, after a green test run.
    runs-on: ubuntu-24.04
    # 30 minutes of requests, about 3 of setup and uploads.
    timeout-minutes: 45
    # The deep-history walk (history.yml, workflow-level group `earthquakes-feed-history`) asks the same hosts (ComCat
    # first): sharing its group, the two never run at once, so each host still gets at most one request a second.
    concurrency:
      group: earthquakes-feed-history
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      # Read only: the day partitions (the work list), the cursor, archives.json and backfill.json.
      - uses: actions/checkout@v5
        with:
          ref: data
          path: .data
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Collect
        env:
          DATA_DIR: .data
          FIRST_SOLUTIONS_OUT: fs-out
          FIRST_SOLUTIONS_UPLOAD: '1'
          FIRST_SOLUTIONS_DAYS: ${{ inputs.days }}
          FIRST_SOLUTIONS_SOURCES: ${{ inputs.sources }}
          FIRST_SOLUTIONS_BUDGET_MIN: ${{ inputs.budget_minutes }}
          # gh: archived months (release download), the chunk uploads and the previous run's artifact.
          GH_TOKEN: ${{ github.token }}
        run: npx --no-install tsx src/first-solutions-collect.ts
      - uses: actions/upload-artifact@v6
        with:
          name: first-solutions-out
          path: |
            fs-out/cursor.json
            fs-out/chunks.ndjson
            fs-out/base.json
            fs-out/summary.json
            fs-out/blocked.txt
          if-no-files-found: error
          retention-days: 7

  commit:
    needs: collect
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # The only part that writes `data`: a sparse checkout of knowledge/first_solutions/ (blobs fetched on demand), two
    # small files, a commit. No writer lock (see the top of this file).
    steps:
      # The main checkout holds only scripts/push-data.sh, the push loop every writer shares. First: checkout empties a
      # directory that is not yet a repository, so it must not run after the artifact download.
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          sparse-checkout: scripts/push-data.sh
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@v7
        with:
          name: first-solutions-out
          path: fs-out
      - uses: actions/checkout@v5
        with:
          ref: data
          path: .data
          fetch-depth: 1
          sparse-checkout: knowledge/first_solutions
      - name: Commit & push cursor and chunk list
        working-directory: .data
        run: |
          dir=knowledge/first_solutions
          mkdir -p "$dir"
          # The collect job read these files; anything else having changed them since means two writers: stop.
          sha() { if [ -f "$1" ]; then sha256sum "$1" | cut -d' ' -f1; else echo null; fi; }
          if [ "$(sha "$dir/cursor.json")" != "$(jq -r '.cursor_sha256 // "null"' ../fs-out/base.json)" ] \
            || [ "$(sha "$dir/chunks.ndjson")" != "$(jq -r '.chunks_sha256 // "null"' ../fs-out/base.json)" ]; then
            echo '::error::knowledge/first_solutions changed since the collect job read it; not overwriting'; exit 1
          fi
          cp ../fs-out/cursor.json ../fs-out/chunks.ndjson "$dir/"
          git config user.name  "earthquakes-feed-bot"
          git config user.email "bot@users.noreply.github.com"
          git add "$dir"
          # Without the writer lock this commit must touch nothing another writer writes.
          staged=$(git diff --cached --name-only | grep -v -x -e "$dir/cursor.json" -e "$dir/chunks.ndjson" || true)
          if [ -n "$staged" ]; then echo "::error::refusing to commit anything but $dir/cursor.json and chunks.ndjson: $staged"; exit 1; fi
          git commit -m "first-solutions: $(jq -r '[.sources | to_entries[] | "\(.key) \(.value.records // 0)"] | join(", ")' ../fs-out/summary.json) @ $(date -u +%FT%TZ)" \
            || { echo 'no changes'; exit 0; }
          # No writer lock (FEED-OPS-4): only this workflow writes these files, so a push that loses the race to another
          # writer fetches, rebases this one commit onto it (no conflict possible) and tries again (scripts/push-data.sh).
          PUSH_ATTEMPTS=6 PUSH_BACKOFF_S=3 bash "$GITHUB_WORKSPACE/scripts/push-data.sh"
      # After the commit, so a stalled source does not hold back the others' progress.
      - name: Fail if a source's walk is stalled
        if: always()
        run: |
          if [ -f fs-out/blocked.txt ]; then
            cat fs-out/blocked.txt
            echo '::error::first-solutions: a source has failed for days (see above); the other sources'"'"' work was committed'
            exit 1
          fi
