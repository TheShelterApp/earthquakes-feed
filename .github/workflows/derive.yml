name: derive

# Phase 2 alone: rebuild derived views (rolling summaries, per-day partitions + Pages day files, manifest) as a pure
# function of the log, then publish (.github/actions/derive-publish). Since FEED-OPS-4 (round 14) every aggregate run
# ends with these same steps on its own checkout, so this workflow is no longer triggered by aggregate (workflow_run)
# or by a cron: each of those runs was a second arrival in the writer group every 5 minutes, and a pending one was
# cancelled by the next arrival (41 derive runs in the week 2026-09-29 → 10-06). Dispatch it by hand to republish
# without fetching: gh workflow run derive.yml -R TheShelterApp/earthquakes-feed
on:
  workflow_dispatch:

concurrency:
  group: earthquakes-feed-writer
  cancel-in-progress: false
  queue: max

permissions:
  contents: write

jobs:
  derive:
    # Pinned, not ubuntu-latest: ubuntu-latest moves to Ubuntu 26.04 from 2026-10-19
    # (actions/runner-images#14748). Move to ubuntu-26.04 deliberately, after a green test run.
    runs-on: ubuntu-24.04
    # 12, not 6: three Pages deploy attempts + backoff cannot fit in 6 min (a failing
    # deploy alone runs ~3 min before erroring out).
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/checkout@v5
        with:
          ref: data
          path: .data
          fetch-depth: 1
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Derive and publish
        uses: ./.github/actions/derive-publish
        with:
          cf-api-token: ${{ secrets.CF_API_TOKEN }}
          cf-account-id: ${{ secrets.CF_ACCOUNT_ID }}
          feed-signing-key: ${{ secrets.FEED_SIGNING_KEY }}
          feed-signing-kid: ${{ vars.FEED_SIGNING_KID }}
          r2-access-key-id: ${{ secrets.R2_ACCESS_KEY_ID }}
          r2-secret-access-key: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          r2-s3-endpoint: ${{ vars.R2_S3_ENDPOINT }}
          r2-bucket: ${{ vars.R2_BUCKET }}
          r2-public-base: ${{ vars.R2_PUBLIC_BASE }}
