name: history

# Deep history (PF-5j; APIs.md, Deep history): walks the feed's history before the 3-year layer
# (knowledge/index/backfill.json targetStart) into immutable `history-YYYY` Release assets: one raw
# asset per source month, one events edition per month, built offline by the backfill's Resolver.
# No day partition is committed and no existing archive or frozen day is touched: the data branch
# gains only knowledge/index/history.json, written by the `commit` job below and nothing else. That job holds no
# writer lock (FEED-OPS-4, round 14): no other writer touches the file, so its push rebases onto theirs.
# Off unless providers/history.json says `"enabled": true` (then the walk runs hourly, a few source
# months per run, one request at a time per host).
# The heartbeat Worker dispatches this workflow hourly at :26 with no inputs (heartbeat/src/worker.js), because GitHub
# delivers this repository's hourly crons a few times a day (the :29 cron below was not delivered once between
# 2026-10-01 16:54 and 21:00 UTC); the cron stays as the fallback when the Worker is down. A dispatched run goes through
# the same gate as a scheduled one: with `enabled` false it stops after the first step.
on:
  schedule:
    - cron: '29 * * * *'
  workflow_dispatch:
    inputs:
      max_units:
        description: 'Source months to fetch this run (blank = maxUnitsPerRun)'
        required: false
      dry_run:
        description: 'Dry run: no Release, no upload, no commit; the produced assets become a 3-day workflow artifact'
        type: boolean
        default: false

# Runs never overlap, so the index each run reads is the one the previous run committed (or, when that
# commit failed, the next run adopts the uploaded assets).
concurrency:
  group: earthquakes-feed-history
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  collect:
    # Outside the writer group: fetching takes minutes and must not hold up the 5-minute aggregate.
    # It writes nothing to the data branch, only Release assets (immutable, never --clobber).
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    outputs:
      changed: ${{ steps.walk.outputs.changed }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Gate (providers/history.json enabled)
        id: gate
        run: |
          if [ "$(jq -r '.enabled' providers/history.json)" = "true" ] || [ "${{ inputs.dry_run }}" = "true" ]; then
            echo "on=true" >> "$GITHUB_OUTPUT"
          else
            echo "on=false" >> "$GITHUB_OUTPUT"
            echo 'history: providers/history.json has enabled=false; nothing to do'
          fi
      - if: steps.gate.outputs.on == 'true'
        uses: actions/checkout@v5
        with:
          ref: data
          path: .data
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: |
            knowledge/index/backfill.json
            knowledge/index/archives.json
            knowledge/index/history.json
          sparse-checkout-cone-mode: false
      - if: steps.gate.outputs.on == 'true'
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - if: steps.gate.outputs.on == 'true'
        run: npm ci
      - name: Walk
        id: walk
        if: steps.gate.outputs.on == 'true'
        env:
          DATA_DIR: .data
          HISTORY_OUT: history-out
          HISTORY_DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
          HISTORY_FORCE: ${{ inputs.dry_run && '1' || '' }}
          HISTORY_MAX_UNITS: ${{ inputs.max_units }}
          GH_TOKEN: ${{ github.token }}
        run: npx --no-install tsx src/history.ts
      - if: steps.walk.outputs.changed == 'true' && !inputs.dry_run
        uses: actions/upload-artifact@v6
        with:
          name: history-index
          path: history-out/history.json
          retention-days: 3
      - if: inputs.dry_run && steps.gate.outputs.on == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: history-dry-run
          path: history-out/
          retention-days: 3
      - name: Fail if the walk was blocked
        if: always()
        run: |
          if [ -f history-blocked.txt ]; then
            cat history-blocked.txt
            echo '::error::history: blocked or stalled (see above); the index of the uploaded work is still committed'
            exit 1
          fi

  commit:
    needs: collect
    # Also after a red collect: whatever it uploaded must reach the index. No writer lock: see the top of this file.
    if: ${{ !cancelled() && needs.collect.outputs.changed == 'true' && !inputs.dry_run }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      # The main checkout holds only scripts/push-data.sh, the push loop every writer shares. First: checkout empties a
      # directory that is not yet a repository, so it must not run after the artifact download.
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          sparse-checkout: scripts/push-data.sh
          sparse-checkout-cone-mode: false
      - uses: actions/checkout@v5
        with:
          ref: data
          path: .data
          fetch-depth: 1
          sparse-checkout: |
            knowledge/index/history.json
          sparse-checkout-cone-mode: false
      - uses: actions/download-artifact@v7
        with:
          name: history-index
          path: history-out
      - name: Commit the history index (and nothing else)
        working-directory: .data
        run: |
          set -euo pipefail
          size=$(wc -c < ../history-out/history.json)
          # The whole proposed deep history (PF-5j: 2000 on, 1973 on, 1900 on) indexes in about 4.5 MB.
          if [ "$size" -gt 8000000 ]; then echo "::error::history.json is $size bytes, over the 8 MB cap"; exit 1; fi
          mkdir -p knowledge/index
          cp ../history-out/history.json knowledge/index/history.json
          git config user.name  "earthquakes-feed-bot"
          git config user.email "bot@users.noreply.github.com"
          git add knowledge/index/history.json
          staged=$(git diff --cached --name-only)
          if [ -z "$staged" ]; then echo 'no changes'; exit 0; fi
          if [ "$staged" != "knowledge/index/history.json" ]; then echo "::error::refusing to commit anything but knowledge/index/history.json: $staged"; exit 1; fi
          git commit -m "history: index @ $(date -u +%FT%TZ)"
          # No writer lock (FEED-OPS-4): only this workflow writes these files, so a push that loses the race to another
          # writer fetches, rebases this one commit onto it (no conflict possible) and tries again (scripts/push-data.sh).
          PUSH_ATTEMPTS=6 PUSH_BACKOFF_S=3 bash "$GITHUB_WORKSPACE/scripts/push-data.sh"
