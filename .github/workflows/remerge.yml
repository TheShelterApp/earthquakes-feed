name: remerge

# The archive re-merge (config REMERGE_EPOCH; src/remerge-archives.ts; APIs.md "Re-merged history"). The monthly
# archives were backfilled with the merge pass off, so one quake is often several feed events there; src/remerge.ts
# replays the live feed's identity steps over each month in sliding 7-day windows and publishes the result as a NEW asset
# `events-YYYY-MM.e<N>.tar.zst` of the month's `archive-YYYY-MM` Release (the old asset stays, listed in the entry's
# `previous[]`), plus a refreshed remediation edition for each remediated day of the month. With REMERGE_EPOCH 0 (the
# kill switch) a run selects nothing. A few months per run, newest first; a month waits until the next one is merged.
#
# The `collect` job runs outside the writer lock (minutes of work) and writes only Release assets, never replacing one.
# The `commit` job applies its results compare-and-set (scripts/remerge-commit.mjs): an entry is replaced only when it
# still has the checksum the result was built on and no `needs_reroll`; a dropped month is merged again by the next run,
# which adopts the uploaded asset by its checksum (the output is deterministic). It stages only
# knowledge/index/archives.json and remediation.json (and, for a rollback, history.json) and pushes through
# scripts/push-data.sh: a concurrent writer of archives.json (archive, backfill) makes the rebase conflict and the push
# fail loudly, never a lost entry. No job holds the writer lock: a job-level lock in that group would be cancelled while
# it waits (FEED-OPS-4, round 14); the side-index commit jobs push without it. The whole workflow shares the
# remediate.yml group, because both write remediation.json.
#
# Cron every 6 h, plus dispatches during the campaign (the heartbeat Worker does not dispatch it).
on:
  schedule:
    - cron: '41 */6 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run: no upload, no commit; the counts and fold lists become a 3-day workflow artifact'
        type: boolean
        default: true
      months:
        description: 'Months per run (blank = REMERGE_MONTHS_PER_RUN, 4)'
        required: false
      only:
        description: 'Only these months, comma-separated YYYY-MM (blank = every month below the epoch)'
        required: false
      epoch:
        description: 'Dry runs only: merge to this epoch although config REMERGE_EPOCH is lower (blank = the config)'
        required: false
      rollback:
        description: 'Rollback instead of a merge: <epoch>[:YYYY-MM,...] withdraws what that epoch published (scripts/remerge-commit.mjs rollback); set REMERGE_EPOCH to 0 first'
        required: false

concurrency:
  group: earthquakes-feed-remediate
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  collect:
    if: ${{ !inputs.rollback }}
    runs-on: ubuntu-24.04
    # About 20-40 s of merge work per month and three downloads; a dry run of all 36 months takes longer.
    timeout-minutes: ${{ inputs.dry_run && 120 || 40 }}
    permissions:
      contents: write
    outputs:
      changed: ${{ steps.run.outputs.changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Blobless: the newest month's newer context reads the data branch's first days after it with `git show`.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: data
          path: .data
          fetch-depth: 1
          filter: blob:none
          persist-credentials: false
          sparse-checkout: |
            knowledge/index/archives.json
            knowledge/index/remediation.json
            knowledge/index/history.json
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Re-merge archive months
        id: run
        env:
          DATA_DIR: .data
          REMERGE_OUT: remerge-out
          REMERGE_DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
          REMERGE_EPOCH_OVERRIDE: ${{ inputs.dry_run && inputs.epoch || '' }}
          REMERGE_MONTHS: ${{ inputs.months }}
          REMERGE_ONLY: ${{ inputs.only }}
          REMERGE_DEADLINE_S: ${{ inputs.dry_run && '6600' || '2100' }}
          # A swarm month holds about 0.5 M lines with its context (the runner has 16 GB).
          NODE_OPTIONS: --max-old-space-size=8192
          # gh: the archive, remediation and history assets (read) and the new assets (upload, never replace).
          GH_TOKEN: ${{ github.token }}
        run: npx --no-install tsx src/remerge-archives.ts
      - if: steps.run.outputs.changed == 'true' && !inputs.dry_run
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: remerge-pending
          path: remerge-out/pending.json
          if-no-files-found: error
          retention-days: 3
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: remerge-report
          path: |
            remerge-out/report.json
            remerge-out/pending.json
            remerge-out/months/
          if-no-files-found: ignore
          retention-days: 3
      # A blocked month keeps the run green: a warning here, and the marker as the artifact walk-blocked-remerge, which
      # the health workflow's feed evaluator (scripts/feed-health.mjs) files on the "[health] feed" board. A dry run's
      # marker stays a warning only. A blocked month is the newest left to merge, so every run selects it first and
      # states it again (SHLTR-151): a run that looked at every month it selected (output `complete`: no deadline cut,
      # no `only`) with nothing blocked uploads a marker without a blocked line (only a "#" line), and the board
      # resolves on the next health run; the 26 h hold is the fallback.
      - name: Warn if a month was blocked
        if: always()
        run: |
          if [ -f remerge-blocked.txt ]; then
            cat remerge-blocked.txt
            echo '::warning::remerge: a month was blocked (see above); the others are still committed, and the health workflow files the marker on the "[health] feed" board'
          fi
      - name: Mark a run with nothing blocked
        if: always() && !inputs.dry_run && steps.run.outcome == 'success' && steps.run.outputs.complete == 'true'
        run: '[ -f remerge-blocked.txt ] || echo "# nothing blocked: run ${{ github.run_id }}" > remerge-blocked.txt'
      - name: Upload the blocked marker (read by the health workflow)
        if: always() && !inputs.dry_run
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: walk-blocked-remerge
          path: remerge-blocked.txt
          if-no-files-found: ignore
          retention-days: 3
          overwrite: true

  commit:
    needs: collect
    # Also after a red collect: whatever it uploaded and listed must reach the index. A rollback runs here alone.
    if: ${{ !cancelled() && !inputs.dry_run && (inputs.rollback || needs.collect.outputs.changed == 'true') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      # The main checkout holds only scripts/push-data.sh, the push loop every writer shares, and the dependency-free
      # scripts/remerge-commit.mjs. First: checkout empties a directory that is not yet a repository, so it must not run
      # after the artifact download.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: |
            scripts/push-data.sh
            scripts/remerge-commit.mjs
            .nvmrc
          sparse-checkout-cone-mode: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: data
          path: .data
          fetch-depth: 1
          sparse-checkout: |
            knowledge/index/archives.json
            knowledge/index/remediation.json
            knowledge/index/history.json
          sparse-checkout-cone-mode: false
      - if: ${{ !inputs.rollback }}
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: remerge-pending
          path: remerge-out
      - name: Apply the results compare-and-set, or the rollback
        env:
          ROLLBACK: ${{ inputs.rollback }}
        run: |
          set -euo pipefail
          if [ -n "${ROLLBACK:-}" ]; then
            epoch="${ROLLBACK%%:*}"
            periods=""
            case "$ROLLBACK" in *:*) periods="${ROLLBACK#*:}" ;; esac
            node scripts/remerge-commit.mjs rollback "$epoch" ${periods:+"$periods"} .data
          else
            node scripts/remerge-commit.mjs apply remerge-out/pending.json .data
          fi
      - name: Commit the archive and remediation indexes (and nothing else)
        working-directory: .data
        env:
          ROLLBACK: ${{ inputs.rollback }}
        run: |
          set -euo pipefail
          git config user.name  "earthquakes-feed-bot"
          git config user.email "bot@users.noreply.github.com"
          git add knowledge/index/archives.json knowledge/index/remediation.json
          if [ -n "${ROLLBACK:-}" ]; then git add knowledge/index/history.json; fi
          staged=$(git diff --cached --name-only)
          if [ -z "$staged" ]; then echo 'no changes'; exit 0; fi
          allowed='knowledge/index/(archives|remediation)\.json'
          if [ -n "${ROLLBACK:-}" ]; then allowed='knowledge/index/(archives|remediation|history)\.json'; fi
          other=$(printf '%s\n' "$staged" | grep -vxE "$allowed" || true)
          if [ -n "$other" ]; then echo "::error::refusing to commit anything but knowledge/index/archives.json and remediation.json: $staged"; exit 1; fi
          if [ -n "${ROLLBACK:-}" ]; then what="rollback $ROLLBACK"; else what=index; fi
          git commit -m "remerge: $what @ $(date -u +%FT%TZ)"
          # No writer lock (see the top of this file): a push that loses the race fetches, rebases this one commit onto
          # the other writer's and tries again; a conflict on archives.json fails it loudly (scripts/push-data.sh).
          PUSH_ATTEMPTS=6 PUSH_BACKOFF_S=3 bash "$GITHUB_WORKSPACE/scripts/push-data.sh"
