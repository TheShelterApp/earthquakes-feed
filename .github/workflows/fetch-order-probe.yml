name: fetch-order-probe

# TEMPORARY (PF-5c): measures on the runner why fetch latency grows with the place in
# aggregate's fetch order. Runs only on pushes to the PF-5c branch; removed before merge.
# Every job is a fresh VM, so each first pass sees a cold resolver cache, as aggregate does.
on:
  push:
    branches: [pf5c/sweep-cursor]
    paths: [scripts/fetch-order-probe.ts, .github/workflows/fetch-order-probe.yml]

permissions:
  contents: read

jobs:
  dns:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { mode: lookup, pool: '' }
          - { mode: lookup, pool: '64' }
          - { mode: cares, pool: '' }
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Probe (no HTTP)
        env:
          POOL: ${{ matrix.pool }}
          MODE: ${{ matrix.mode }}
        # An empty UV_THREADPOOL_SIZE means ONE thread to libuv, so set it only when given.
        run: |
          if [ -n "$POOL" ]; then export UV_THREADPOOL_SIZE="$POOL"; fi
          npx --no-install tsx scripts/fetch-order-probe.ts "$MODE"

  # The fetch probes send each live source one request; serialised so ComCat and EMSC see
  # one request per job, minutes apart.
  fetch-default:
    needs: dns
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx --no-install tsx scripts/fetch-order-probe.ts fetch

  fetch-pool64:
    needs: fetch-default
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx --no-install tsx scripts/fetch-order-probe.ts fetch
        env:
          UV_THREADPOOL_SIZE: '64'

  fetch-default-warm:
    needs: fetch-pool64
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx --no-install tsx scripts/fetch-order-probe.ts fetch --warm
