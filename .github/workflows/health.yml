name: health

# Watchdogs (alerting plan of 2026-10-22, Phase 1a; README "Health watchdogs"). The heartbeat Worker dispatches this
# workflow every 15 min (:07/:22/:37/:52); the `:25` cron is the fallback for a Worker outage and runs its checks only
# when no workflow_dispatch health run was created in the last 20 min; the monthly selftest cron forces a P1.
#   gate      scripts/reconcile.mjs --gate: whether this run judges at all (the fallback cron's skip) and whether it is
#             a selftest
#   feed      scripts/feed-health.mjs: the live v1/v2 manifests, the per-source status, the data files, the repository
#             size and the walks' blocked markers
#   alerts    scripts/alerts-watchdog.mjs: The Shelter's alert pipeline (data.theshelter.app/alerts/status.json, the
#             USGS canary, the optional account usage)
#   platform  scripts/platform-watchdog.mjs: The Shelter's API and config Workers and the config bundle's age
#   reconcile scripts/reconcile.mjs: the only writer of the three board issues ("[health] alert pipeline", "[health]
#             feed", "[health] platform"; created together on the first run, then pinned and locked) and the only
#             pinger; it sets the run's conclusion: red on every run a P1's finding holds (or cannot be judged), during
#             the first hour of a P2, and when alerting itself is broken (the boards unreadable, a board body not
#             created or saved, board comments failing on two runs in a row, no GH_TOKEN).
# The evaluator jobs are stateless: each writes one findings document (scripts/lib/findings.mjs) as the artifact
# findings-<evaluator> and exits 0 whatever it judged; a non-zero exit is a crash (the run is red, and reconcile files
# watcher:evaluator:<name> and freezes that evaluator's entries). Everything that needs memory across runs (the 2-run
# confirmation, 4 of the last 8 runs, resolving, escalation, the promotion, inhibition, silences, the P2 red hour, the
# last selftest) is reconcile's, in the boards' hidden state. A single external source, a maintenance walk and the
# watcher itself never turn a run red.
on:
  schedule:
    - cron: '25 * * * *'
    # The selftest (scripts/reconcile.mjs SELFTEST_CRON): 09:17 UTC on the 1st of each month, a forced P1, so the run
    # must be red; it proves the red path and the failed-run email once a month. GitHub can drop a scheduled run, so
    # reconcile tracks the last selftest: 35 days without one opens watcher:selftest-overdue.
    - cron: '17 9 1 * *'
  workflow_dispatch:
    inputs:
      watchdog_selftest:
        description: 'Selftest: force the P1 finding alerts:selftest, so this run MUST be red (proves the red path and the email)'
        type: boolean
        default: false

# One health run at a time: reconcile reads the boards' state, applies the run's findings and writes it back, so two
# runs must never interleave. A queued run waits (a newer arrival replaces it); none is cancelled mid-flight.
concurrency:
  group: health
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  gate:
    # Pinned, not ubuntu-latest: ubuntu-latest moves to Ubuntu 26.04 from 2026-10-19
    # (actions/runner-images#14748). Move to ubuntu-26.04 deliberately, after a green test run.
    runs-on: ubuntu-24.04
    # One GET (the dispatched health runs), only on the fallback cron: 3 tries of 20 s at most.
    timeout-minutes: 5
    permissions:
      contents: read
      # Lists this workflow's dispatched runs (the fallback cron's skip).
      actions: read
    outputs:
      run: ${{ steps.gate.outputs.run }}
      selftest: ${{ steps.gate.outputs.selftest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: scripts
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      # The `:25` cron skips its checks when a workflow_dispatch health run was CREATED in the last 20 min, running or
      # not (on 2026-10-21 the dispatched run created at 15:22:30 was still running when the scheduled one started at
      # 15:22:39, and both turned red on the same GEOFON outage), unless it was cancelled or skipped: a pending dispatched
      # run is cancelled when a newer one joins the concurrency group. A listing that fails means run.
      - name: Gate (the fallback cron's skip, the selftest)
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          SELFTEST_INPUT: ${{ inputs.watchdog_selftest }}
        run: node scripts/reconcile.mjs --gate

  feed:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-24.04
    # Manifest reads of 4 tries x 20 s, the deliberate 60 s re-read (a stale manifest, or a run that sat over 10 min in
    # the runner queue: on 2026-07-25 the queue stalled 1 h 54 min) and the GitHub reads (the data tree allows 60 s a
    # try) run in parallel; 10 min leaves room for the worst case of each.
    timeout-minutes: 10
    permissions:
      contents: read
      # This run's created_at (its queue time) and the walks' walk-blocked-<workflow> marker artifacts.
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # providers/registry.json: the source ids a walk marker's line is filed under.
          sparse-checkout: |
            scripts
            providers
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - name: Judge the feed (findings for the "[health] feed" board)
        env:
          # GitHub's own API only (the script hard-codes the host): the run, the repository's size, the data tree, the
          # walk markers. A read that fails (or no token) is the finding watcher:feed-github.
          GH_TOKEN: ${{ github.token }}
        run: node scripts/feed-health.mjs --findings findings/feed.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: findings-feed
          path: findings/feed.json
          if-no-files-found: error
          retention-days: 3
          overwrite: true

  alerts:
    # It runs from GitHub, not Cloudflare, on purpose: it must keep working when Cloudflare is the thing that broke.
    name: alert pipeline
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-24.04
    # status.json: 3 tries x 15 s + 7 s backoff; the canary one 15 s try; the optional usage query the same as
    # status.json. 5 min leaves room for checkout + setup-node.
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: scripts
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - name: Judge the alert pipeline (findings for the "[health] alert pipeline" board)
        env:
          # Optional (owner): a read-only Cloudflare token with Account Analytics: Read. Unset -> the usage half
          # (platform:cf-usage) is skipped. The account queried is the CF_ANALYTICS_ACCOUNT_ID variable when set, else
          # the repo's CF_ACCOUNT_ID secret (the one the Pages deploy uses); a token without an account, or one that
          # cannot see it, is the finding watcher:cf-usage.
          CF_ANALYTICS_TOKEN: ${{ secrets.CF_ANALYTICS_TOKEN }}
          CF_ACCOUNT_ID: ${{ vars.CF_ANALYTICS_ACCOUNT_ID || secrets.CF_ACCOUNT_ID }}
          # '1' on a selftest run (the dispatch input, or the monthly cron): the finding alerts:selftest (P1).
          WATCHDOG_SELFTEST: ${{ needs.gate.outputs.selftest }}
        run: node scripts/alerts-watchdog.mjs --findings findings/alerts.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: findings-alerts
          path: findings/alerts.json
          if-no-files-found: error
          retention-days: 3
          overwrite: true

  platform:
    # A job of its own, like `alerts`, and from GitHub for the same reason.
    name: api and config
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-24.04
    # The API's 3 tries are 30 s apart (an outage under a minute is not reported): about 60-105 s, in parallel with
    # /healthz and status.json; 5 min leaves room for checkout + setup-node.
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: scripts
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - name: Judge api.theshelter.app, config.theshelter.app and the config bundle (findings for the "[health] platform" board)
        run: node scripts/platform-watchdog.mjs --findings findings/platform.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: findings-platform
          path: findings/platform.json
          if-no-files-found: error
          retention-days: 3
          overwrite: true

  reconcile:
    needs: [gate, feed, alerts, platform]
    # Also after an evaluator failed: its findings are then missing, which reconcile reports (watcher:evaluator:<name>)
    # and which freezes that evaluator's entries instead of resolving them. Not when the gate skipped the run, nor in a
    # run cancelled by hand (it would record its stopped evaluators as missing).
    if: ${{ !cancelled() && needs.gate.outputs.run == 'true' }}
    runs-on: ubuntu-24.04
    # A few GitHub API calls: each board read by its number (scripts/health-boards.json), the REST and the GraphQL label
    # listings (duplicates, retired once: renamed, unpinned, closed, unlabelled); a board still to be made (null there):
    # the five labels, its creation, pin and lock; then per board at most one comment (3 tries on a network error, a 429 or a 5xx), its body and its labels (GET,
    # PATCH and PUT retried twice; a board locked against the bot is unlocked and locked again around the write); once
    # a day one GraphQL query of the pins and locks. Pings only with HC_PING_KEY (unset: none).
    timeout-minutes: 10
    permissions:
      contents: read
      # The only job that writes issues: the boards' bodies, labels, comments, pin and lock.
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: scripts
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      # This run's findings-<evaluator> artifacts, as findings/<evaluator>.json; one that is missing (its job failed)
      # is simply absent.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: findings-*
          path: findings
          merge-multiple: true
      # Exit 0 green, 1 red (a P1 whose finding holds, a P2 in its first hour, the selftest), 3 red because alerting
      # itself is broken: the boards unreadable; a board body not created (one POST, tried again by the next run), not
      # saved after its retries, or too long even shrunk (the boards are the memory of every rule: without them nothing
      # confirms, resolves or comments); a new board that cannot be labelled; board comments failing on two runs in a
      # row; no GH_TOKEN, a bad argument or a crash. A comment that fails once is an ::error::, retried by the next run
      # (watcher:reconcile); a failed ping, label edit, lock or pin check is a ::warning:: and never changes the exit
      # code.
      - name: Reconcile the boards and set the run's verdict
        env:
          GH_TOKEN: ${{ github.token }}
          # key=until,reason;... (README "Health watchdogs"): mutes a key's comments and pings until a date.
          HEALTH_SILENCES: ${{ vars.HEALTH_SILENCES }}
          # Healthchecks.io ping key (owner decision 2026-10-22: no push channel for now, so it is unset and every
          # ping is skipped). A capability: the script never logs it or the ping URLs.
          HC_PING_KEY: ${{ secrets.HC_PING_KEY }}
        run: node scripts/reconcile.mjs --findings-dir findings
